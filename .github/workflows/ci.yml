name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portability-lint:
    name: Portability lint (core/, evals/ must stay framework-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check core/ and evals/ never import langgraph/langchain
        run: python scripts/check_portability.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: portability-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
