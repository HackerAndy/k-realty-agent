name: CI

on:
  # Manual only for now — automatic push/PR triggers are off while CI
  # reliability work is in progress.
  workflow_dispatch:

env:
  # The version this is actually developed and run on. 3.11 was aspirational and
  # never proved anything — the test job failed at install on every push.
  PYTHON_VERSION: "3.14"

jobs:
  portability-lint:
    name: Portability lint (core/, evals/ must stay framework-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Deliberately installs nothing: the script is stdlib only (ast, sys,
      # pathlib), so the portability contract is still checked even when the
      # dependency set is broken — which is exactly the state this repo was in.
      - name: Check core/ and evals/ never import langgraph/langchain
        run: python scripts/check_portability.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: portability-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Poetry, not pip. This project's metadata lives under [tool.poetry] with
      # four top-level packages: `pip install -e ".[dev]"` fell back to setuptools,
      # which refuses a flat layout it can't disambiguate — and there is no [dev]
      # extra to install either, since dev dependencies are a Poetry group.
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: |
          poetry env use "$(which python)"
          poetry install --no-interaction
      # The suite used to launch no browser, and said so here — the
      # Playwright-facing code was all exercised through fakes. That is fine for
      # the code that DRIVES a browser and useless for the code that RUNS INSIDE
      # one: the demo recorder's injected listener passed its fake-backed tests
      # for months while never having been installed even once, because a fake
      # `page.evaluate` answers whether or not anything was ever injected. The
      # tests that catch that need a real DOM. They skip cleanly without one, so
      # removing this step loses the coverage silently — leave it.
      - name: Install Chromium
        run: poetry run playwright install --with-deps chromium
      # rest_server.py serves frontend/'s Vite build (interfaces/web/dist/,
      # gitignored like any build artifact), and test_dashboard_is_served
      # fetches the real built bundle — so it has to exist before pytest runs,
      # same as any other generated file the tests depend on.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Run tests
        run: poetry run pytest
