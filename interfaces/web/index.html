<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-Realty · property finance</title>
<style>
  :root {
    --bg: #faf9f5; --card: #ffffff; --border: #e7e5df; --text: #1c1b19;
    --muted: #6b6a64; --accent: #3b6d3b; --danger: #a3312d; --success: #2c6a3a;
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --bg: #161818; --card: #202325; --border: #34393d; --text: #e8ecef;
    --muted: #a2abb2; --accent: #88c888; --danger: #f08a84; --success: #94d89f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip.warn { background: #fbf1e0; border-color: #e6d9b8; color: #855009; }
  :root[data-theme="dark"] .chip.warn { background: #3f3525; border-color: #6c5a3e; color: #f3c98f; }
  button { font: inherit; cursor: pointer; }
  .btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; color: var(--text); font-size: 13px; }
  .btn:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .btn:hover { background: #292d30; }
  .btn:disabled { opacity: .55; cursor: default; }
  .icon-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .icon-btn:hover { background: #f2f1ec; color: var(--text); }
  :root[data-theme="dark"] .icon-btn:hover { background: #292d30; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .kpi .lbl { font-size: 12px; color: var(--muted); }
  .kpi .val { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi-graph { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 20px; }
  .kpi-graph .lbl { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .pie-wrap { display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .pie-wrap svg { width: 180px; height: 180px; display: block; }
  .pie-legend { display: flex; flex-direction: column; gap: 8px; min-width: 170px; }
  .pie-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 7px; }
  .dot.in { background: var(--success); }
  .dot.out { background: var(--danger); }
  .pie-item .name { color: var(--muted); white-space: nowrap; }
  .pie-empty { color: var(--muted); font-size: 13px; }
  .view {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .18s ease, transform .18s ease;
  }
  .view.is-hidden {
    display: none;
    opacity: 0;
    transform: translateY(6px);
  }
  nav {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    width: min(900px, 100%);
    margin-left: auto;
    margin-right: auto;
    justify-content: center;
  }
  nav button {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    color: var(--muted);
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
  }
  nav button:hover { background: #f2f1ec; color: var(--text); }
  :root[data-theme="dark"] nav button:hover { background: #292d30; }
  nav button.active {
    color: var(--text);
    border-color: color-mix(in oklab, var(--accent) 45%, var(--border));
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent) inset;
    font-weight: 600;
  }
  .nav-ico {
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav-ico svg { display: block; }
  .nav-ico.ingest svg { width: 24px; height: 24px; }
  .nav-ico.process svg { width: 24px; height: 24px; }
  .nav-ico.reporting svg { width: 20px; height: 20px; }
  .nav-ico.ingest { color: var(--text); }
  .nav-ico.process { color: #3d5263; }
  :root[data-theme="dark"] .nav-ico.process { color: #9ab3c6; }
  .nav-ico.reporting { color: var(--text); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  thead th { border-top: none; color: var(--muted); font-weight: 500; }
  td.amt, th.amt { text-align: right; }
  .neg { color: var(--danger); }
  .pos { color: var(--success); }
  .src { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); font-size: 13px; }
  .src:first-child { border-top: none; }
  .src .meta { color: var(--muted); font-size: 12px; }
  .src-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 170px; }
  .src-actions .btn { width: fit-content; }
  .upload-progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .upload-progress progress { width: 120px; height: 8px; }
  .upload-steps-row { display: none; border-top: 1px dashed var(--border); padding: 8px 14px 11px 14px; }
  .upload-steps { display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; }
  .upload-step { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .upload-step::before { content: ''; width: 8px; height: 8px; border-radius: 999px; background: #b8b9b3; flex: 0 0 auto; }
  .upload-step.pending::before { background: #b8b9b3; }
  .upload-step.in-progress::before { background: #2f77d1; }
  .upload-step.success::before { background: var(--success); }
  .upload-step.failed::before { background: var(--danger); }
  .upload-step-sep { color: var(--muted); font-size: 12px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #eceae3; color: var(--muted); margin-left: 6px; }
  .empty { padding: 22px 14px; color: var(--muted); font-size: 13px; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-size: 13px;
    padding: 10px 16px;
    border-radius: var(--radius);
    display: none;
    z-index: 1000;
    max-width: min(90vw, 520px);
    text-align: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
  }
  #toast.ok { background: #e8f1e8; color: var(--success); display: block; }
  #toast.err { background: #f7e6e5; color: var(--danger); display: block; }
  :root[data-theme="dark"] #toast.ok { background: #223229; }
  :root[data-theme="dark"] #toast.err { background: #3d2828; }

  /* ── Ingest accordion (per-source acquire + validation) ── */
  .acc { display: flex; flex-direction: column; gap: 10px; }
  .accitem { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .accitem.open { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .acchead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .acchead:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .acchead:hover { background: #292d30; }
  .accitem.open .acchead { border-bottom: 1px solid var(--border); }
  .acchead .sdot { width: 8px; height: 8px; border-radius: 999px; flex: none; background: #b8b9b3; }
  .acchead .sdot.ready { background: var(--success); }
  .acchead .sdot.trig { background: #c99a3a; }
  .acchead .info { flex: 1; min-width: 0; }
  .acchead .nm { font-weight: 600; font-size: 14.5px; }
  .acchead .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .acchead .rt { text-align: right; font-size: 13px; }
  .acchead .rt .net { font-weight: 600; }
  .acchead .rt .netlbl { color: var(--muted); font-size: 11px; }
  .acchead .caret { color: var(--muted); font-size: 18px; transition: transform .12s; display: inline-block; }
  .accitem.open .caret { transform: rotate(90deg); }
  .accbody { padding: 16px; }
  .accbody .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }

  .kstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .kstrip .k { background: var(--card); padding: 11px 13px; }
  .kstrip .k .l { font-size: 11.5px; color: var(--muted); }
  .kstrip .k .v { font-size: 18px; font-weight: 600; margin-top: 3px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .controls .grp { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .controls select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .controls input[type=search] { flex: 1; min-width: 170px; font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .controls .hint { font-size: 11.5px; color: var(--muted); }
  .tbl-wrap { border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  .tbl-wrap table td, .tbl-wrap table th { border-top: 1px solid var(--border); }
  .tbl-wrap thead th { background: color-mix(in oklab, var(--muted) 8%, var(--card)); position: sticky; top: 0; }
  .rollup { border-top: 1px solid var(--border); }
  .rollup:first-child { border-top: none; }
  .rollup-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 13px; cursor: pointer; }
  .rollup-h:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .rollup-h:hover { background: #292d30; }
  .rollup-h .cnt { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .rollup-h .caret { color: var(--muted); display: inline-block; transition: transform .12s; }
  .rollup.open .rollup-h .caret { transform: rotate(90deg); }
  .rollup-body { display: none; }
  .rollup.open .rollup-body { display: block; }
  .notbuilt { background: color-mix(in oklab, var(--muted) 7%, var(--card)); border: 1px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .notbuilt b { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>K-Realty · property finance</h1>
      <div class="sub">Local dashboard </div>
    </div>
    <div class="chips">
      <span class="chip" id="llm">LLM …</span>
      <span class="chip" id="pending" style="display:none"></span>
      <button class="btn" onclick="refresh()">Refresh</button>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Enable dark mode" title="Enable dark mode"><span id="theme-icon" aria-hidden="true">&#9790;</span></button>
    </div>
  </header>

  <div id="reporting-content" class="view">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Money in</div><div class="val pos" id="k-in">—</div></div>
      <div class="kpi"><div class="lbl">Money out</div><div class="val neg" id="k-out">—</div></div>
      <div class="kpi"><div class="lbl">Net</div><div class="val" id="k-net">—</div></div>
      <div class="kpi"><div class="lbl">Transactions</div><div class="val" id="k-count">—</div></div>
    </div>

    <div class="kpi-graph">
      <div class="lbl">Cash flow mix</div>
      <div id="kpi-pie" class="pie-wrap"><div class="pie-empty">No transaction totals yet.</div></div>
    </div>
  </div>

  <div class="panel view is-hidden" id="panel"></div>

  <nav>
    <button id="nav-ingest" onclick="show('ingest')"><span class="nav-ico ingest" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4.2 3.8 8.8 8.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6.2 8.4h2.6V5.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 15V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 15v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>Ingest data</button>
    <button id="nav-process" onclick="show('process')"><span class="nav-ico process" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M14.3 2.7h-4.6l-.4 2.1a7.8 7.8 0 0 0-1.8.8L5.6 4.3 2.3 7.6l1.3 1.9c-.3.6-.6 1.2-.8 1.8l-2.1.4v4.6l2.1.4c.2.6.5 1.3.8 1.8l-1.3 1.9 3.3 3.3 1.9-1.3c.6.3 1.2.6 1.8.8l.4 2.1h4.6l.4-2.1c.6-.2 1.2-.5 1.8-.8l1.9 1.3 3.3-3.3-1.3-1.9c.3-.6.6-1.2.8-1.8l2.1-.4v-4.6l-2.1-.4a7.2 7.2 0 0 0-.8-1.8l1.3-1.9-3.3-3.3-1.9 1.3c-.6-.3-1.2-.6-1.8-.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg></span>Process data</button>
    <button id="nav-reporting" class="active" onclick="show('reporting')"><span class="nav-ico reporting" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="15" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 13V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 13V6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 13v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>Reporting</button>
  </nav>
  <div id="toast"></div>
</div>

<script>
  // ── the ONLY transport-specific code. Standalone: POST to the REST server.
  // In a Claude Live Artifact this one function becomes window.claude.callMcpTool.
  async function callTool(name, args = {}) {
    const res = await fetch('/api/tool/' + name, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = data && Object.prototype.hasOwnProperty.call(data, 'detail') ? data.detail : null;
      const msg = (detail && detail.message) ? detail.message : (detail || (name + ' failed'));
      const err = new Error(msg);
      err.detail = detail;
      throw err;
    }
    return data;
  }

  const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const el = id => document.getElementById(id);
  let current = 'reporting';
  const THEME_KEY = 'krealty-theme';
  const actionStepHistory = {};
  const actionRunState = {};

  // Ingest accordion state: which source is expanded, per-source validation
  // controls (group/search), and a cache of each source's transactions.
  const ingestOpen = { key: null };
  const sourceView = {};      // source_key -> { group, query }
  const sourceTxnCache = {};  // source_key -> source_transactions() result
  const svState = k => sourceView[k] || (sourceView[k] = { group: 'None', query: '' });

  function llmHost(baseUrl) {
    if (!baseUrl) return 'not set';
    try {
      const normalized = baseUrl.includes('://') ? baseUrl : ('http://' + baseUrl);
      let host = new URL(normalized).hostname || '';
      if (host.endsWith('.local')) host = host.slice(0, -6);
      return host || 'not set';
    } catch {
      // Best-effort parsing for non-URL strings.
      let host = String(baseUrl).replace(/^https?:\/\//i, '').split('/')[0].split('?')[0].split('#')[0];
      if (host.startsWith('[') && host.includes(']')) host = host.slice(1, host.indexOf(']'));
      else host = host.split(':')[0];
      if (host.endsWith('.local')) host = host.slice(0, -6);
      return host || 'not set';
    }
  }

  function toast(msg, ok) { const t = el('toast'); t.textContent = msg; t.style.display = ''; t.className = ok ? 'ok' : 'err'; }
  function clearToast() { const t = el('toast'); t.className = ''; t.style.display = 'none'; }
  function sourceDomId(sourceKey) { return String(sourceKey || '').replace(/[^a-zA-Z0-9_-]/g, '_'); }
  function setSourceButtonsDisabled(disabled) { document.querySelectorAll('.accbody button, .src button').forEach(b => b.disabled = disabled); }

  function defaultUploadSteps(fileName) {
    return [
      { key: 'selected_file', label: 'File selected' + (fileName ? ': ' + fileName : ''), status: 'success' },
      { key: 'upload_to_server', label: 'Upload to server (0%)', status: 'pending' },
      { key: 'save_temp_file', label: 'Save temp file', status: 'pending' },
      { key: 'ingest_document', label: 'Parse and persist', status: 'pending' },
      { key: 'cleanup_temp_file', label: 'Cleanup temp file', status: 'pending' },
      { key: 'done', label: 'Complete', status: 'pending' },
    ];
  }

  function renderUploadSteps(sourceKey, steps) {
    const host = el('upload-steps-' + sourceDomId(sourceKey));
    const row = el('upload-steps-row-' + sourceDomId(sourceKey));
    if (!host || !row) return;
    row.style.display = 'block';

    let html = '';
    steps.forEach((step, idx) => {
      const cls = step.status || 'pending';
      const title = step.error ? (' title="' + String(step.error).replace(/"/g, '&quot;') + '"') : '';
      html += '<span class="upload-step ' + cls + '"' + title + '>' + (step.label || step.key) + '</span>';
      if (idx < steps.length - 1) html += '<span class="upload-step-sep">&gt;</span>';
    });
    host.innerHTML = html;
    actionStepHistory[sourceKey] = steps.map(s => ({ ...s }));
  }

  function startActionRun(sourceKey, tool) {
    const runId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    actionRunState[sourceKey] = { runId, tool };
    return runId;
  }

  function isCurrentActionRun(sourceKey, runId) {
    const state = actionRunState[sourceKey];
    return !!state && state.runId === runId;
  }

  function defaultActionSteps(tool) {
    if (tool === 'run_scraper') {
      return [
        { key: 'run_scraper', label: 'Run scraper', status: 'pending' },
        { key: 'persist_scraped', label: 'Persist scraped transactions', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'fetch_source') {
      return [
        { key: 'fetch_and_ingest', label: 'Fetch and ingest', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'activate_parser') {
      return [
        { key: 'activate_parser', label: 'Activate parser', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'start_login_recovery') {
      return [
        { key: 'launch_browser', label: 'Launch recovery browser', status: 'pending' },
        { key: 'user_login', label: 'Log in, then CLOSE the browser window to save the session', status: 'pending' },
        { key: 'session_saved', label: 'Session saved', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    return [
      { key: 'execute', label: 'Execute', status: 'pending' },
      { key: 'done', label: 'Complete', status: 'pending' },
    ];
  }

  function updateUploadStep(steps, key, status, label, error) {
    const next = steps.map(s => ({ ...s }));
    const idx = next.findIndex(s => s.key === key);
    if (idx >= 0) {
      next[idx].status = status || next[idx].status;
      if (label) next[idx].label = label;
      if (error) next[idx].error = error;
    }
    return next;
  }

  function applyServerUploadSteps(steps, serverSteps) {
    let next = steps.map(s => ({ ...s }));
    for (const serverStep of (serverSteps || [])) {
      const existing = next.find(s => s.key === serverStep.key);
      if (existing) {
        next = updateUploadStep(next, serverStep.key, serverStep.status, serverStep.label, serverStep.error);
      } else {
        const doneIdx = next.findIndex(s => s.key === 'done');
        const inserted = {
          key: serverStep.key,
          label: serverStep.label || serverStep.key,
          status: serverStep.status || 'pending',
          error: serverStep.error,
        };
        if (doneIdx >= 0) next.splice(doneIdx, 0, inserted);
        else next.push(inserted);
      }
    }
    return next;
  }

  function setTheme(theme) {
    const root = document.documentElement;
    root.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
    const next = theme === 'dark' ? 'light' : 'dark';
    el('theme-icon').innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
    el('theme-toggle').setAttribute('aria-label', 'Enable ' + next + ' mode');
    el('theme-toggle').setAttribute('title', 'Enable ' + next + ' mode');
  }

  function initialTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
  }

  function pieSlicePath(cx, cy, r, startAngle, endAngle) {
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;
    return 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' Z';
  }

  function renderKpiPie(moneyIn, moneyOut) {
    const income = Math.max(0, Number(moneyIn) || 0);
    const outgoing = Math.abs(Number(moneyOut) || 0);
    const total = income + outgoing;
    const host = el('kpi-pie');

    if (!total) {
      host.innerHTML = '<div class="pie-empty">No transaction totals yet.</div>';
      return;
    }

    const start = -Math.PI / 2;
    const split = start + (income / total) * Math.PI * 2;
    const incomePath = pieSlicePath(100, 100, 78, start, split);
    const outPath = pieSlicePath(100, 100, 78, split, start + Math.PI * 2);

    host.innerHTML = '<svg viewBox="0 0 200 200" aria-label="Money in versus money out pie chart" role="img">' +
      '<circle cx="100" cy="100" r="78" fill="none" stroke="var(--border)" stroke-width="1"></circle>' +
      '<path d="' + incomePath + '" fill="var(--success)"></path>' +
      '<path d="' + outPath + '" fill="var(--danger)"></path>' +
      '</svg>' +
      '<div class="pie-legend">' +
      '<div class="pie-item"><span class="name"><span class="dot in"></span>Money in</span><b>' + money(income) + '</b></div>' +
      '<div class="pie-item"><span class="name"><span class="dot out"></span>Money out</span><b>' + money(outgoing) + '</b></div>' +
      '</div>';
  }

  async function loadStatus() {
    try {
      const s = await callTool('status');
      el('llm').textContent = 'LLM: ' + llmHost(s.llm.base_url) + (s.llm.model ? ' · ' + s.llm.model : '');
      const p = s.pending_approvals || [];
      const pe = el('pending');
      if (p.length) { pe.style.display = ''; pe.className = 'chip warn'; pe.textContent = p.length + ' approval' + (p.length > 1 ? 's' : '') + ' needed'; }
      else { pe.style.display = 'none'; }
    } catch (e) { el('llm').textContent = 'LLM: unavailable'; }
  }

  async function loadKpis() {
    const d = await callTool('latest_transactions', { limit: 200 });
    el('k-in').textContent = money(d.money_in || 0);
    el('k-out').textContent = money(d.money_out || 0);
    const net = (d.money_in || 0) + (d.money_out || 0);
    el('k-net').textContent = money(net);
    el('k-net').className = 'val ' + (net < 0 ? 'neg' : 'pos');
    el('k-count').textContent = d.count || 0;
    renderKpiPie(d.money_in || 0, d.money_out || 0);
    return d;
  }

  async function renderReporting() {
    await loadKpis();
    el('panel').innerHTML = '';
  }

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  async function renderIngest() {
    el('panel').innerHTML = '<div class="empty">Loading sources…</div>';
    const [sourcesRes, pendingRes] = await Promise.allSettled([
      callTool('list_sources'),
      callTool('pending_approvals')
    ]);

    if (sourcesRes.status !== 'fulfilled') {
      const msg = (sourcesRes.reason && sourcesRes.reason.message) ? sourcesRes.reason.message : 'unknown error';
      el('panel').innerHTML = '<div class="empty">Could not load sources: ' + msg + '</div>';
      toast('Failed to load sources: ' + msg, false);
      return;
    }

    const sources = sourcesRes.value || [];
    const pending = pendingRes.status === 'fulfilled' ? (pendingRes.value || []) : [];
    if (pendingRes.status !== 'fulfilled') {
      const pendingErr = (pendingRes.reason && pendingRes.reason.message) ? pendingRes.reason.message : 'unknown error';
      toast('Loaded sources, but pending approvals failed: ' + pendingErr, false);
    }
    const pendingKeys = new Set(pending.map(p => p.key));

    if (!sources.length) { el('panel').innerHTML = '<div class="empty">No sources.</div>'; return; }

    // Load transactions for the open source before rendering its body.
    const openKey = ingestOpen.key;
    if (openKey && sources.some(s => s.key === openKey) && !sourceTxnCache[openKey]) {
      try { sourceTxnCache[openKey] = await callTool('source_transactions', { source_key: openKey }); }
      catch (e) { sourceTxnCache[openKey] = { error: e.message, transactions: [], count: 0, money_in: 0, money_out: 0 }; }
    }

    let html = '<div class="acc">';
    for (const s of sources) {
      const isOpen = s.key === openKey;
      const isPending = pendingKeys.has(s.key);
      const dotClass = s.status === 'implemented' ? 'ready' : (s.is_trigger ? 'trig' : '');
      const tags = (s.has_scraper ? '<span class="tag">scraper</span>' : '') +
        (s.parser_built ? '<span class="tag">parser</span>' : '') +
        (isPending ? '<span class="tag">needs approval</span>' : '');
      const data = isOpen ? sourceTxnCache[s.key] : null;
      const rt = (data && data.count)
        ? '<div class="rt"><div class="net ' + (netOf(data) < 0 ? 'neg' : 'pos') + '">' + money(netOf(data)) + '</div><div class="netlbl">net · ' + data.count + ' rows</div></div>'
        : '';
      html += '<div class="accitem' + (isOpen ? ' open' : '') + '">' +
        '<div class="acchead" onclick="toggleSource(\'' + s.key + '\')">' +
          '<span class="sdot ' + dotClass + '"></span>' +
          '<div class="info"><div class="nm">' + esc(s.label) + tags + '</div>' +
            '<div class="meta">' + esc(s.status) + ' · ' + esc(s.input_type || '') + '</div></div>' +
          rt + '<span class="caret">&#8250;</span></div>' +
        (isOpen ? '<div class="accbody">' + sourceBodyHTML(s, isPending) + '</div>' : '') +
      '</div>';
    }
    html += '</div>';
    el('panel').innerHTML = html;

    // Rehydrate the open source's action step timeline + wire its file input.
    if (openKey) {
      const prior = actionStepHistory[openKey];
      if (prior && prior.length) renderUploadSteps(openKey, prior);
    }
  }

  function netOf(data) { return (data.money_in || 0) + (data.money_out || 0); }

  function toggleSource(key) {
    ingestOpen.key = (ingestOpen.key === key) ? null : key;
    renderIngest();
  }

  function sourceActionHTML(s, isPending) {
    let btns = '';
    if (isPending) btns += '<button class="btn" onclick="act(\'activate_parser\',{source_key:\'' + s.key + '\'})">Activate parser</button>';
    if (s.has_scraper) btns += '<button class="btn" onclick="act(\'run_scraper\',{source_key:\'' + s.key + '\'})">Run scraper</button>';
    else if (s.is_trigger) btns += '<button class="btn" onclick="act(\'fetch_source\',{source_key:\'' + s.key + '\'})">Fetch now</button>';
    else if (canUploadForInputType(s.input_type)) btns += sourceUploadAction(s.key);
    return btns;
  }

  function sourceBodyHTML(s, isPending) {
    const actions = '<div class="actions">' + sourceActionHTML(s, isPending) + '</div>' + sourceUploadStepsRow(s.key);
    const data = sourceTxnCache[s.key];
    if (!data) return actions + '<div class="empty">Loading transactions…</div>';
    if (data.error) return actions + '<div class="notbuilt">Couldn’t load transactions: ' + esc(data.error) + '</div>';
    if (!data.transactions || !data.transactions.length) {
      const msg = s.is_trigger
        ? 'This is a <b>delivery trigger</b>, not a ledger. Fetched documents are ingested under the source they’re routed to — nothing to validate here directly.'
        : 'No transactions yet. Acquire data above to validate it here.';
      return actions + '<div class="notbuilt">' + msg + '</div>';
    }
    return actions + '<div id="detail-' + sourceDomId(s.key) + '" class="__detail">' + validationHTML(s.key, data) + '</div>';
  }

  function faithfulCols(rows) { return rows.length ? Object.keys(rows[0].fields || {}) : []; }

  function txnTableHTML(rows) {
    if (!rows.length) return '<div class="empty">No rows match.</div>';
    const cols = faithfulCols(rows);
    if (!cols.length) return '<div class="empty">No columns to show.</div>';
    const head = cols.map(c => '<th class="' + (c === 'Amount' ? 'amt' : '') + '">' + esc(c) + '</th>').join('');
    const body = rows.map(t => '<tr>' + cols.map(c => {
      const v = (t.fields || {})[c];
      if (c === 'Amount') { const n = parseFloat(v); return '<td class="amt ' + (n < 0 ? 'neg' : 'pos') + '">' + (isNaN(n) ? esc(v) : money(n)) + '</td>'; }
      return '<td title="' + esc(v) + '">' + esc(v) + '</td>';
    }).join('') + '</tr>').join('');
    return '<div class="tbl-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function validationHTML(key, data) {
    const view = svState(key);
    const rowsAll = data.transactions || [];
    const cols = faithfulCols(rowsAll);
    const net = netOf(data);
    const strip = '<div class="kstrip">' +
      '<div class="k"><div class="l">Money in</div><div class="v pos">' + money(data.money_in || 0) + '</div></div>' +
      '<div class="k"><div class="l">Money out</div><div class="v neg">' + money(data.money_out || 0) + '</div></div>' +
      '<div class="k"><div class="l">Net</div><div class="v ' + (net < 0 ? 'neg' : 'pos') + '">' + money(net) + '</div></div>' +
      '<div class="k"><div class="l">Rows</div><div class="v">' + (data.count || 0) + '</div></div></div>';

    const groupSafe = cols.includes(view.group) ? view.group : 'None';
    const opts = ['None'].concat(cols).map(o =>
      '<option value="' + esc(o) + '"' + (o === groupSafe ? ' selected' : '') + '>' + (o === 'None' ? 'None (flat ledger)' : esc(o)) + '</option>').join('');
    const controls = '<div class="controls">' +
      '<div class="grp">Group by <select onchange="setSourceGroup(\'' + key + '\',this.value)">' + opts + '</select></div>' +
      '<input type="search" placeholder="Search this source…" value="' + esc(view.query) + '" oninput="setSourceQuery(\'' + key + '\',this.value)">' +
      '<span class="hint">columns are this source’s own</span></div>';

    // filter
    let rows = rowsAll.slice();
    if (view.query.trim()) {
      const q = view.query.toLowerCase();
      rows = rows.filter(t => Object.values(t.fields || {}).some(v => String(v).toLowerCase().includes(q)));
    }

    let bodyHTML;
    if (groupSafe === 'None') {
      bodyHTML = txnTableHTML(rows);
    } else {
      const g = {};
      rows.forEach(t => { const gk = (t.fields || {})[groupSafe] || '—'; (g[gk] = g[gk] || []).push(t); });
      const keys = Object.keys(g).sort((a, b) => g[b].length - g[a].length);
      bodyHTML = '<div class="tbl-wrap">' + (keys.length ? keys.map((gk, i) => {
        const gnet = g[gk].reduce((sum, t) => sum + t.amount, 0);
        return '<div class="rollup" id="ru_' + sourceDomId(key) + '_' + i + '">' +
          '<div class="rollup-h" onclick="toggleRollup(\'' + key + '\',' + i + ')">' +
            '<span><span class="caret">&#8250;</span> <b>' + esc(gk) + '</b><span class="cnt">' + g[gk].length + ' rows</span></span>' +
            '<span class="' + (gnet < 0 ? 'neg' : 'pos') + '">' + money(gnet) + '</span></div>' +
          '<div class="rollup-body">' + txnTableHTML(g[gk]) + '</div></div>';
      }).join('') : '<div class="empty">No rows match.</div>') + '</div>';
    }
    return strip + controls + bodyHTML;
  }

  function toggleRollup(key, i) { const r = el('ru_' + sourceDomId(key) + '_' + i); if (r) r.classList.toggle('open'); }

  function setSourceGroup(key, value) { svState(key).group = value.startsWith('None') ? 'None' : value; renderDetailInPlace(key); }
  function setSourceQuery(key, value) { svState(key).query = value; renderDetailInPlace(key, true); }

  function renderDetailInPlace(key, keepFocus) {
    const data = sourceTxnCache[key];
    const holder = el('detail-' + sourceDomId(key));
    if (!holder || !data || !data.transactions || !data.transactions.length) return;
    const active = document.activeElement;
    const wasSearch = active && active.type === 'search';
    const caret = wasSearch ? active.selectionStart : null;
    holder.innerHTML = validationHTML(key, data);
    if (keepFocus && wasSearch) {
      const ns = holder.querySelector('input[type=search]');
      if (ns) { ns.focus(); try { ns.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  function sourceUploadAction(sourceKey) {
    const sid = sourceDomId(sourceKey);
    return '<div class="src-actions">' +
      '<button class="btn" onclick="chooseUpload(\'' + sourceKey + '\')">Upload file</button>' +
      '<input id="upload-input-' + sid + '" type="file" style="display:none" accept=".pdf,.csv,text/csv,application/pdf" onchange="handleUploadFile(\'' + sourceKey + '\', event)" />' +
      '<div class="upload-progress" id="upload-progress-' + sid + '" style="display:none">' +
      '<progress id="upload-bar-' + sid + '" max="100" value="0"></progress>' +
      '<span id="upload-pct-' + sid + '">0%</span>' +
      '</div></div>';
  }

  function sourceUploadStepsRow(sourceKey) {
    const sid = sourceDomId(sourceKey);
    return '<div class="upload-steps-row" id="upload-steps-row-' + sid + '"><div class="upload-steps" id="upload-steps-' + sid + '"></div></div>';
  }

  function canUploadForInputType(inputType) {
    return inputType === 'pdf_statement' || inputType === 'csv_export' || inputType === 'html_scrape';
  }

  function chooseUpload(sourceKey) {
    const input = el('upload-input-' + sourceDomId(sourceKey));
    if (input) input.click();
  }

  function handleUploadFile(sourceKey, event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    uploadIngest(sourceKey, file).finally(() => {
      if (input) input.value = '';
    });
  }

  function uploadIngest(sourceKey, file) {
    clearToast();
    setSourceButtonsDisabled(true);
    const runId = startActionRun(sourceKey, 'upload_ingest');
    const sid = sourceDomId(sourceKey);
    const progressWrap = el('upload-progress-' + sid);
    const progressBar = el('upload-bar-' + sid);
    const progressPct = el('upload-pct-' + sid);
    if (progressWrap) progressWrap.style.display = 'flex';
    if (progressBar) progressBar.value = 0;
    if (progressPct) progressPct.textContent = '0%';
    let steps = defaultUploadSteps(file.name);
    steps = updateUploadStep(steps, 'upload_to_server', 'in-progress', 'Upload to server (0%)');
    renderUploadSteps(sourceKey, steps);
    toast('Uploading ' + file.name + '… 0%', true);

    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload_ingest/' + encodeURIComponent(sourceKey));

      xhr.upload.onprogress = (evt) => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        if (!evt.lengthComputable) return;
        const pct = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
        if (progressBar) progressBar.value = pct;
        if (progressPct) progressPct.textContent = pct + '%';
        steps = updateUploadStep(steps, 'upload_to_server', 'in-progress', 'Upload to server (' + pct + '%)');
        renderUploadSteps(sourceKey, steps);
        toast('Uploading ' + file.name + '… ' + pct + '%', true);
      };

      xhr.onerror = () => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        steps = updateUploadStep(steps, 'upload_to_server', 'failed', 'Upload to server', 'Network error');
        renderUploadSteps(sourceKey, steps);
        toast('upload_ingest failed: network error', false);
        if (progressWrap) progressWrap.style.display = 'none';
        setSourceButtonsDisabled(false);
        reject(new Error('Network error'));
      };

      xhr.onload = async () => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        let payload = {};
        try {
          payload = xhr.responseText ? JSON.parse(xhr.responseText) : {};
        } catch {
          payload = {};
        }

        if (xhr.status >= 200 && xhr.status < 300) {
          steps = updateUploadStep(steps, 'upload_to_server', 'success', 'Upload to server (100%)');
          steps = applyServerUploadSteps(steps, payload.steps);
          steps = updateUploadStep(steps, 'done', 'success', 'Complete');
          renderUploadSteps(sourceKey, steps);
          if (progressBar) progressBar.value = 100;
          if (progressPct) progressPct.textContent = '100%';
          toast('upload_ingest done' + (payload.count != null ? ' — ' + payload.count + ' transactions' : '') + '.', true);
          await loadStatus();
          await loadKpis();
          delete sourceTxnCache[sourceKey];
          if (current === 'ingest') await renderIngest();
          resolve(payload);
        } else {
          const detail = payload && payload.detail ? payload.detail : ('HTTP ' + xhr.status);
          const detailMessage = detail && detail.message ? detail.message : detail;
          const serverSteps = detail && detail.steps ? detail.steps : [];
          steps = updateUploadStep(steps, 'upload_to_server', 'success', 'Upload to server (100%)');
          steps = applyServerUploadSteps(steps, serverSteps);
          if (!serverSteps.length) steps = updateUploadStep(steps, 'done', 'failed', 'Complete', String(detailMessage));
          else steps = updateUploadStep(steps, 'done', 'failed', 'Complete');
          renderUploadSteps(sourceKey, steps);
          toast('upload_ingest failed: ' + detailMessage, false);
          if (progressWrap) progressWrap.style.display = 'none';
          setSourceButtonsDisabled(false);
          reject(new Error(detailMessage));
        }
      };

      const form = new FormData();
      form.append('file', file);
      xhr.send(form);
    });
  }

  function renderProcess() {
    el('panel').innerHTML = '<div class="empty">Data processing — categorization, reconciliation, and P&amp;L — isn’t built yet. ' +
      'It’s deliberately deferred: ingested transactions are stored faithfully first.</div>';
  }

  function beginLoginRecoveryPolling(sourceKey, runId, resumeTool, resumeArgs) {
    const poll = async () => {
      if (!isCurrentActionRun(sourceKey, runId)) return;
      try {
        const status = await callTool('login_recovery_status', { source_key: sourceKey });
        if (!isCurrentActionRun(sourceKey, runId)) return;
        let latest = actionStepHistory[sourceKey] || defaultActionSteps('start_login_recovery');
        if (status && Array.isArray(status.steps)) {
          latest = applyServerUploadSteps(latest, status.steps);
        }
        if (status && status.status === 'completed') {
          latest = updateUploadStep(latest, 'done', 'success', 'Complete');
          renderUploadSteps(sourceKey, latest);
          await loadStatus(); await loadKpis();
          if (current === 'ingest') await renderIngest();
          if (resumeTool) {
            // The original action failed only because the session was stale —
            // now that login is recovered, automatically continue it instead
            // of leaving the operator to notice and re-click it themselves.
            toast('Login recovered. Re-running ' + resumeTool + '…', true);
            await act(resumeTool, resumeArgs, { allowAutoRecovery: false });
          } else {
            setSourceButtonsDisabled(false);
          }
          return;
        }
        if (status && status.status === 'failed') {
            const failure = status && status.message ? status.message : 'login recovery failed';
            latest = updateUploadStep(latest, 'done', 'failed', 'Complete', failure);
          renderUploadSteps(sourceKey, latest);
          setSourceButtonsDisabled(false);
          return;
        }
        renderUploadSteps(sourceKey, latest);
        setTimeout(poll, 2000);
      } catch (err) {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        let latest = actionStepHistory[sourceKey] || defaultActionSteps('start_login_recovery');
        latest = updateUploadStep(latest, 'done', 'failed', 'Complete', err && err.message ? err.message : 'status check failed');
        renderUploadSteps(sourceKey, latest);
        setSourceButtonsDisabled(false);
      }
    };
    setTimeout(poll, 1200);
  }

  function shouldAutoRecoverLogin(tool, err) {
    if (tool !== 'run_scraper') return false;
    const detail = err && err.detail ? err.detail : null;
    const msg = String((detail && detail.message) || (err && err.message) || '');
    const authLike = /(\b401\b|unauthor|session|login|credential|sign[\s-]?in|2fa|verification)/i;
    if (authLike.test(msg)) return true;
    const stepErrors = detail && Array.isArray(detail.steps)
      ? detail.steps.map(s => String(s && s.error ? s.error : '')).join(' | ')
      : '';
    return authLike.test(stepErrors);
  }

  async function act(tool, args, options = {}) {
    const allowAutoRecovery = options.allowAutoRecovery !== false;
    clearToast();
    setSourceButtonsDisabled(true);
    toast('Running ' + tool + '…', true);
    const sourceKey = args && args.source_key ? args.source_key : null;
    let runId = null;
    let steps = null;
    if (sourceKey) {
      runId = startActionRun(sourceKey, tool);
      steps = defaultActionSteps(tool);
      const first = steps.find(s => s.key !== 'done');
      if (first) {
        steps = updateUploadStep(steps, first.key, 'in-progress', first.label);
      }
      renderUploadSteps(sourceKey, steps);
    }

    try {
      const r = await callTool(tool, args);
      if (sourceKey && runId && !isCurrentActionRun(sourceKey, runId)) return;
      if (steps) {
        if (r && Array.isArray(r.steps) && r.steps.length) {
          steps = applyServerUploadSteps(steps, r.steps);
        } else {
          const first = steps.find(s => s.status === 'in-progress') || steps.find(s => s.key !== 'done');
          if (first) steps = updateUploadStep(steps, first.key, 'success', first.label);
        }
        if (tool === 'start_login_recovery') {
          steps = updateUploadStep(steps, 'done', 'in-progress', 'Complete');
        } else {
          steps = updateUploadStep(steps, 'done', 'success', 'Complete');
        }
        renderUploadSteps(sourceKey, steps);
      }

      if (tool === 'start_login_recovery' && sourceKey) {
        beginLoginRecoveryPolling(sourceKey, runId);
      }

      toast(tool + ' done' + (r.count != null ? ' — ' + r.count + ' transactions' : '') + '.', true);
      await loadStatus(); await loadKpis();
      if (sourceKey) delete sourceTxnCache[sourceKey];
      if (current === 'ingest') await renderIngest();
    } catch (e) {
      if (sourceKey && runId && !isCurrentActionRun(sourceKey, runId)) return;
      if (steps) {
        const detail = e && e.detail ? e.detail : null;
        const serverSteps = detail && Array.isArray(detail.steps) ? detail.steps : [];
        if (serverSteps.length) {
          steps = applyServerUploadSteps(steps, serverSteps);
        } else {
          const first = steps.find(s => s.status === 'in-progress') || steps.find(s => s.key !== 'done');
          if (first) steps = updateUploadStep(steps, first.key, 'failed', first.label, e && e.message ? e.message : 'failed');
        }
        steps = updateUploadStep(steps, 'done', 'failed', 'Complete', e && e.message ? e.message : 'failed');
        renderUploadSteps(sourceKey, steps);
      }

      if (allowAutoRecovery && sourceKey && shouldAutoRecoverLogin(tool, e)) {
        toast('Auth/session issue detected. Starting login recovery…', false);
        const recoveryRunId = startActionRun(sourceKey, 'start_login_recovery');
        let recoverySteps = defaultActionSteps('start_login_recovery');
        recoverySteps = updateUploadStep(recoverySteps, 'launch_browser', 'in-progress', 'Launch recovery browser');
        renderUploadSteps(sourceKey, recoverySteps);

        try {
          const recovery = await callTool('start_login_recovery', { source_key: sourceKey });
          if (!isCurrentActionRun(sourceKey, recoveryRunId)) return;
          if (recovery && Array.isArray(recovery.steps)) {
            recoverySteps = applyServerUploadSteps(recoverySteps, recovery.steps);
          }
          recoverySteps = updateUploadStep(recoverySteps, 'done', 'in-progress', 'Complete');
          renderUploadSteps(sourceKey, recoverySteps);
          toast('Recovery browser opened. Complete login in browser, then close it to save session.', true);
          // Once the operator finishes logging in, automatically re-run the
          // scraper call that originally failed — don't leave data un-pulled.
          beginLoginRecoveryPolling(sourceKey, recoveryRunId, tool, args);
          return;
        } catch (recoveryErr) {
          if (!isCurrentActionRun(sourceKey, recoveryRunId)) return;
          recoverySteps = updateUploadStep(
            recoverySteps,
            'done',
            'failed',
            'Complete',
            recoveryErr && recoveryErr.message ? recoveryErr.message : 'failed to start recovery'
          );
          renderUploadSteps(sourceKey, recoverySteps);
          toast('Automatic login recovery failed: ' + (recoveryErr && recoveryErr.message ? recoveryErr.message : 'unknown error'), false);
          setSourceButtonsDisabled(false);
          return;
        }
      }

      toast(tool + ' failed: ' + e.message, false);
      setSourceButtonsDisabled(false);
    }
  }

  function show(section) {
    current = section;
    for (const s of ['reporting', 'ingest', 'process']) el('nav-' + s).className = s === section ? 'active' : '';
    el('reporting-content').className = 'view' + (section === 'reporting' ? '' : ' is-hidden');
    el('panel').className = 'panel view' + (section === 'reporting' ? ' is-hidden' : '');
    clearToast();
    ({ reporting: renderReporting, ingest: renderIngest, process: renderProcess })[section]();
  }

  async function refresh() { clearToast(); await loadStatus(); show(current); }

  setTheme(initialTheme());
  loadStatus();
  show('reporting');
</script>
</body>
</html>
