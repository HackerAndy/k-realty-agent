   *  either place changes it in both. */
  function websitePanel(s) {
    const head = panelHead('Website — how the harness gets in');
    if (!credCache) return head + '<div class="build-b"><p class="note" style="margin:0">Loading the sign-in…</p></div>';
    const c = credCache.find(x => x.key === s.key && x.kind !== 'inbox');
    if (!c) {
      return head + '<div class="build-b"><p class="note" style="margin:0">' +
        'No sign-in is stored for this source yet. Add one under <b>Settings → Sign-ins</b>.</p>' +
        '<div class="row"><button class="btn" onclick="show(\'settings\')">Open Settings</button></div>' +
        '</div>';
    }
    const sid = sourceDomId(s.key);
    return head + '<div class="build-b">' +
      '<p class="note" style="margin:0 0 12px">The same sign-in as <b>Settings → Sign-ins</b>; ' +
      'changing it here changes it there. It’s shared, so anything else using this portal gets ' +
      'the change too.</p>' +
      (c.login_url ? '<div class="field"><label>Address</label>' +
        '<input type="text" value="' + esc(c.login_url) + '" readonly></div>' : '') +
      '<div class="field"><label for="cu-' + sid + '">Username or email</label>' +
      '<input type="text" id="cu-' + sid + '" value="' + esc(c.username) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="cp-' + sid + '">Password</label>' +
      '<input type="password" id="cp-' + sid + '" autocomplete="off" placeholder="' +
        (c.has_password ? '•••••••••••• saved' : 'not set') + '">' +
      '<span class="sub">' + (c.has_password ? 'Leave blank to keep the saved one. ' : '') +
      'Stored encrypted in <b>.secrets/</b> — never in the repo, never shown back to you.</span></div>' +
      '<div class="row"><button class="btn" onclick="saveCredentials(\'' + s.key + '\')">' +
      (c.has_username && c.has_password ? 'Update' : 'Save') + '</button></div></div>';
  }

  function uploadPanel(s) {
    return panelHead('File upload — a document you already have') +
      '<div class="build-b"><p class="note" style="margin:0">Nothing to set up. Press ⏵ on the ' +
      'chip to choose a document. What happens to it afterwards belongs to the reader, one ' +
      'stage along.</p></div>';
  }

  /** Which rows belong under the graph right now.
   *
   *  Selecting a route asks a question about THAT route, so it answers with that
   *  route's own last run — not with whatever ran most recently, which would put
   *  one route's rows under another route's name. A route that has never run says
   *  so, and names the route that did produce what the source has. */
  function selectedData(s) {
    const sel = graphSel[s.key];
    const route = (s.transports || []).find(r => r.id === sel);
    if (!route) return sourceTxnCache[s.key];       // nothing selected, or a reader
    if (!route.last_run) {
      // The route that produced the rows the source is showing — which is the
      // most RECENT run, not merely the first route that has ever run. Naming
      // the wrong one sends the operator to a route that isn't holding the data.
      const live = (s.transports || [])
        .filter(r => r.last_run)
        .sort((a, b) => (b.last_run.parsed_at || '').localeCompare(a.last_run.parsed_at || ''))[0];
      const where = live
        ? ' The rows this source has came in by <b>' + esc(live.label.toLowerCase()) + '</b>.'
        : '';
      // Only point at ⏵ when there IS one. An unavailable route's chip has no run
      // control, so telling the operator to press it sends them looking for a
      // button that isn't there — say what's missing instead.
      const why = route.reason || 'this route isn’t available yet';
      const next = route.available
        ? ' Press ⏵ on the chip to bring the data in this way.'
        : ' ' + esc(why.charAt(0).toUpperCase() + why.slice(1)) + '.';
      return { notRun: '<b>' + esc(route.label) + '</b> has never run — nothing to show for it.' +
        where + next };
    }
    return routeTxnCache[s.key + '|' + sel];        // undefined while it loads
  }

  function sourceBodyHTML(s, isPending) {
    const actions = funnelHTML(s) + verdictHTML(s, isPending) + sourceUploadStepsRow(s.key);
    // The build/fix panel sits directly under the action + step timeline, BEFORE
    // the data: when a run fails, "what to do next" belongs next to the failure,
    // not below a table the operator has to scroll past to find it.
    // Options sit between "how it arrives" and "fix the code": adjusting a date
    // range is the ordinary thing to do, rewriting the scraper is the rare one.
    // The model offer sits ahead of the build panel: "read it now" is the answer
    // when you need the numbers today; "build a parser" is the answer for every
    // month after that.
    const head = actions + offerHTML(s) + nodePanelHTML(s);
    const data = selectedData(s);
    if (data && data.notRun) return head + '<div class="notbuilt">' + data.notRun + '</div>';
    if (!data) return head + '<div class="empty">Loading transactions…</div>';
    if (data.error) return head + '<div class="notbuilt">Couldn’t load transactions: ' + esc(data.error) + '</div>';
    if (!data.transactions || !data.transactions.length) {
      // Carriers are no longer listed as sources, so the old "this is a delivery
      // trigger, not a ledger" apology has nothing left to explain.
      const msg = s.default_transport
        ? 'No transactions yet — use <b>Get latest</b> above to bring some in.'
        : 'No working route yet. Build a parser or a scraper below, then get the data.';
      return head + '<div class="notbuilt">' + msg + '</div>';
    }
    return head + '<div id="detail-' + sourceDomId(s.key) + '" class="__detail">' +
      validationHTML(s.key, data) + '</div>';
  }

  // ── Agent build: sample -> agent writes parser + test -> operator approves ──
  // Long-running, so start_build returns immediately and we tail build_status.
  const buildState = {};   // source_key -> { sample, events, status, result, passed, feedback, token }
  const bs = k => buildState[k] || (buildState[k] = { sample: null, events: [], status: 'idle', feedback: '' });

  /** Which code the agent would work on. Normally the source's own kind — a
   *  portal is maintained as a SCRAPER, anything else as a parser — but when the
   *  operator has selected a reading node, that node decides: DFCU has a parser
   *  and no scraper, so its "No scraper yet" node must offer a demonstration,
   *  not offer to rebuild the parser it already has. */
  function buildKindFor(s, forNode) {
    if (forNode) return forNode;
    // Before a scraper exists, only the source itself says it's a portal — so
    // a newly added website is offered a demonstration, not a sample document.
    return (s.has_scraper || s.input_type === 'html_scrape') ? 'scraper' : 'parser';
  }

  /** Did the last action on this source end in failure? */
  function lastActionFailed(key) {
    const steps = actionStepHistory[key];
    return !!(steps && steps.some(s => s.status === 'failed'));
  }

  /** Work the operator must not lose track of, whatever is selected: a build in
   *  flight, or a result waiting to be approved. The slot shows this even with
   *  nothing selected, because a running build that only appears when you happen
   *  to click the right node is a build you can lose. */
  function buildDemandsAttention(s) {
    const st = bs(s.key);
    return (st.status && st.status !== 'idle') || lastActionFailed(s.key);
  }

  function buildPanel(s, forNode) {
    if (s.is_trigger) return '';   // a trigger has no code of its own to build
    const st = bs(s.key);
    const sid = sourceDomId(s.key);
    const kind = buildKindFor(s, forNode);
    st.kind = kind;
    const title = kind === 'scraper'
      ? (s.has_scraper ? 'Fix this source’s scraper' : 'Teach the harness this website')
      : (s.parser_built ? 'Rebuild' : 'Build') + ' this source’s parser';

    let inner;
    if (st.status === 'running') {
      const shown = st.events.slice(-40);
      // A spinner says "something is happening", which is exactly what an operator
      // watching a wedged build for 21 minutes was told. So say how long it has
      // been quiet, and what it was doing when it went quiet.
      const idle = st.idle_seconds || 0;
      const quiet = idle >= 20
        ? '<div class="' + (st.stalled ? 'notbuilt' : 'note') + '" style="margin-top:10px">' +
          (st.stalled ? '<b>Nothing for ' + fmtIdle(idle) + '.</b> A local model can go quiet for a ' +
                        'couple of minutes; longer than that and it may be stuck. It will be given up ' +
                        'on automatically, or you can stop it now.'
                      : 'Quiet for ' + fmtIdle(idle) + ' — waiting on the model.') +
          (st.last_event ? '<div class="sub" style="margin-top:4px">Last: ' + esc(st.last_event) + '</div>' : '') +
          '</div>'
        : '';
      inner = '<div class="stream" id="stream-' + sid + '">' +
        (shown.length ? shown.map((e, i) =>
          '<span class="' + (i === shown.length - 1 ? 'last' : '') + '">' + esc(e) + '</span>').join('\n')
          : 'Starting the agent…') + '</div>' + quiet +
        '<div class="row" style="margin-top:12px">' +
        '<button class="btn" onclick="stopBuild(\'' + s.key + '\')">Stop this build</button>' +
        '<span class="hint">This takes a few minutes. You can leave this page open; ' +
        'progress keeps streaming.</span></div>';
    } else if (st.status === 'completed' || st.status === 'failed') {
      inner = buildResultHTML(s, st);
    } else if (kind === 'scraper' && !s.has_scraper) {
      inner = demonstrateHTML(s);
    } else if (kind === 'scraper') {
      // Revise needs no demonstration — the agent reads the harness's own
      // failure logs, so a broken scrape is fixable straight from here.
      inner =
        '<p class="note" style="margin:0 0 12px">When a scrape fails, the harness fixes its own code: ' +
        'its agent reads the failure logs, edits <code>core/scrapers/' + esc(s.key) + '.py</code>, updates the ' +
        'test, and the harness re-runs that test independently before anything is used.</p>' +
        '<div class="label">Anything to add? (optional — it reads the logs either way)</div>' +
        '<textarea id="feedback-' + sid + '" placeholder="e.g. the transactions POST returns 403">' +
          esc(st.feedback || '') + '</textarea>' +
        '<div class="row" style="margin-top:10px">' +
        '<button class="btn primary" onclick="reviseBuild(\'' + s.key + '\')">Have the agent fix the scraper</button>' +
        '</div>';
    } else {
      inner =
        '<p class="note" style="margin:0 0 12px">The harness writes the parser itself: give it one real ' +
        'sample document, and its own agent writes the code <b>and a test</b>, then re-runs that test ' +
        'independently. Nothing activates until you approve it.</p>' +
        (st.sample
          ? '<div class="kv">Sample: <b>' + esc(st.sample.filename) + '</b> (' + st.sample.bytes.toLocaleString() + ' bytes)</div>'
          : '') +
        '<div class="row">' +
        '<button class="btn" onclick="chooseSample(\'' + s.key + '\')">' +
          (st.sample ? 'Choose a different sample' : 'Choose a sample document') + '</button>' +
        '<input id="sample-input-' + sid + '" type="file" style="display:none" accept=".pdf,.csv,text/csv,application/pdf" ' +
          'onchange="handleSampleFile(\'' + s.key + '\', event)" />' +
        (st.sample
          ? '<button class="btn primary" onclick="startBuild(\'' + s.key + '\')">' +
            (s.parser_built ? 'Rebuild' : 'Build') + ' the parser</button>'
          : '') +
        // Building takes minutes; sometimes you just need this month's numbers.
        (st.sample && !s.parser_built
          ? '<button class="btn" onclick="offerExtract(\'' + s.key + '\',\'extract\',' +
            esc(JSON.stringify(st.sample.sample_path)) + ',' + esc(JSON.stringify(st.sample.filename)) + ')">' +
            'Read it now with the model</button>'
          : '') +
        '</div>';
    }

    const running = st.status === 'running';
    return '<div class="build-h" style="cursor:default">' +
      (running ? '<span class="spin"></span>' : '<span class="caret open">&#8250;</span>') +
      (running ? 'Agent is working on the ' + kind + '…' : title) +
      '</div><div class="build-b" id="build-' + sid + '">' + inner + '</div>';
  }

  // ── Demonstrating a portal ─────────────────────────────────────────────────
  // The scraper equivalent of "here's a sample document": the operator does it
  // once, by hand, and the harness records what happened for its agent to read.
  // Finishing is closing the window — there is no terminal to press Enter at.
  const demoState = {};   // source_key -> { status, message, demo_path, login_url, ... }

  function demonstrateHTML(s) {
    const d = demoState[s.key] || {};
    if (d.status === 'running') {
      return '<div class="stream">' + esc(d.message || 'A browser is open…') + '</div>' +
        '<p class="note" style="margin:12px 0 0">Sign in, choose the dates or filters you want, ' +
        'and click Generate/Search so <b>your</b> data is on screen. Then <b>close the browser ' +
        'window</b> — that’s how you tell the harness you’re done.</p>';
    }

    const failed = d.status === 'failed'
      ? '<div class="verdict fail">' + esc(d.message || 'The demonstration wasn’t captured') + '</div>' : '';

    if (d.status === 'completed') {
      return failed +
        '<div class="verdict pass">Demonstration captured — ' + (d.captured_requests || 0) +
        ' requests, ' + (d.recorded_actions || 0) + ' clicks</div>' +
        (d.login_url ? '<div class="kv">Signed in at <b>' + esc(d.login_url) + '</b> — saved, so the ' +
          'harness knows where to go next time.</div>' : '') +
        '<p class="note" style="margin:10px 0 12px">The agent will read that demonstration, write ' +
        '<code>core/scrapers/' + esc(s.key) + '.py</code> <b>and a test</b>, and the harness re-runs ' +
        'that test independently before anything is used.</p>' +
        '<div class="row"><button class="btn primary" onclick="startBuild(\'' + s.key + '\')">' +
        'Have the agent write the scraper</button>' +
        '<button class="btn" onclick="startDemo(\'' + s.key + '\')">Demonstrate again</button></div>';
    }

    return failed +
      '<p class="note" style="margin:0 0 12px">Show the harness how to get this data, once. ' +
      'A browser opens — sign in, set your filters, and click Generate/Search until your data is on ' +
      'screen, then close the window. The harness records the network traffic and your clicks, and ' +
      'its agent writes the scraper from that. No URL needed: it learns where you went.</p>' +
      '<div class="row"><button class="btn primary" onclick="startDemo(\'' + s.key + '\')">' +
      'Open a browser and show it</button></div>';
  }

  async function startDemo(key) {
    clearToast();
    try {
      await callTool('start_demo', { source_key: key });
      demoState[key] = { status: 'running', message: 'A browser is opening…' };
      await renderIngest();
      pollDemo(key);
    } catch (e) {
      demoState[key] = { status: 'failed', message: e.message };
      await renderIngest();
    }
  }

  function pollDemo(key) {
    const tick = async () => {
      let d;
      try { d = await callTool('demo_status', { source_key: key }); }
      catch (e) { demoState[key] = { status: 'failed', message: 'Lost contact with the demonstration: ' + e.message }; await renderIngest(); return; }
      if (d.status === 'running') {
        // Don't re-render while they're working in the browser.
        demoState[key] = d;
        setTimeout(tick, 2000);
        return;
      }
      demoState[key] = d;
      // The demo taught the harness the portal's URL, so the source changed.
      await renderIngest();
      toast(d.status === 'completed' ? d.message : ('Demonstration failed: ' + d.message),
            d.status === 'completed');
    };
    setTimeout(tick, 2000);
  }

  function buildResultHTML(s, st) {
    const sid = sourceDomId(s.key);
    const kind = st.kind || 'parser';
    if (st.status === 'failed') {
      return '<div class="verdict fail">The agent run failed</div>' +
        '<div class="label">What went wrong</div>' +
        '<div class="stream">' + esc(st.message || 'The run failed.') + '</div>' +
        '<div class="row" style="margin-top:12px">' +
        '<button class="btn" onclick="resetBuild(\'' + s.key + '\')">Start over</button>' +
        (kind === 'scraper' || st.sample
          ? '<button class="btn primary" onclick="' +
            (kind === 'scraper' ? 'reviseBuild' : 'startBuild') + '(\'' + s.key + '\')">Try again</button>'
          : '') +
        '</div>';
    }

    const r = st.result || {};
    const v = r.verification || {};
    const test = v.test || {};
    const txns = v.transactions || [];
    let verdict;
    if (!st.passed) {
      // Name what actually refused it. "The test did not pass" was shown for every
      // refusal — including a run whose test passed 17/17 and was refused because
      // the agent's last turn wrote no file.
      const why = (st.blockers && st.blockers.length)
        ? '<ul style="margin:6px 0 0 18px;padding:0">' +
          st.blockers.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>'
        : '';
      verdict = '<div class="verdict fail">Not usable yet</div>' + why;
    } else if (kind === 'scraper') {
      // A scraper self-registers; the proof is its test, and then a real run.
      verdict = '<div class="verdict pass">Test passed' +
        (v.registered ? ' — scraper registered' : '') + '</div>';
    } else {
      verdict = '<div class="verdict pass">Test passed — ' + txns.length + ' transactions parsed</div>';
    }

    let body = verdict;

    // What it did, as a short list of acts. The model's own account of the run can
    // be tens of thousands of characters — unreadable, and it buries the outcome —
    // so the acts come from the recorded tool calls and the prose is a click away.
    // A run that ended itself says so even when what it wrote is acceptable —
    // "it stopped early" changes how much weight to put on the result.
    if (v.agent_stopped) {
      body += '<div class="notbuilt" style="margin-bottom:10px">' + esc(v.agent_stopped) + '</div>';
    }

    const did = st.did || {};
    if ((did.files || []).length || (did.commands || []).length || did.reads) {
      const bits = [];
      if ((did.files || []).length) bits.push('<b>Wrote</b> ' + did.files.map(esc).join(', '));
      if ((did.commands || []).length) bits.push('<b>Ran</b> ' + did.commands.length +
        ' command' + (did.commands.length > 1 ? 's' : '') + ': ' +
        did.commands.slice(0, 3).map(c => '<code>' + esc(c) + '</code>').join(', '));
      if (did.reads) bits.push('Read ' + did.reads + ' file' + (did.reads > 1 ? 's' : ''));
      if (!(did.files || []).length) bits.push('<b>Wrote no file</b>');
      body += '<div class="label">What it did</div>' +
        '<div class="note" style="margin:0 0 10px">' + bits.join(' · ') + '</div>';
    }
    if (r.agent_summary) {
      body += '<details style="margin-bottom:10px"><summary style="cursor:pointer;font-size:12px;' +
        'color:var(--muted)">Its own account of the run (' +
        r.agent_summary.length.toLocaleString() + ' characters)</summary>' +
        '<div class="stream">' + esc(r.agent_summary) + '</div></details>';
    }

    // The gate: the harness re-ran the agent's own test in a clean subprocess.
    body += '<div class="label">Independent test run' + (test.ok ? ' — passed' : ' — failed') + '</div>' +
      '<div class="stream">' + esc((test.output || v.error || '(no output)').slice(-3000)) + '</div>';
    if (v.untested_code && v.untested_code.length) {
      body += '<div class="label">Written without a test</div><div class="stream">' +
        esc(v.untested_code.join('\n')) + '</div>';
    }

    if (txns.length) {
      body += '<div class="label">Parsed from your sample — check these are right</div>' +
        txnTableHTML(txns.slice(0, 25).map(t => ({ amount: t.amount, fields: t.fields })));
    }
    if (kind === 'scraper' && st.passed) {
      body += '<div class="label">Next</div><p class="note" style="margin:0">A passing test means the code is ' +
        'sound, not that the portal accepted it. Run the scraper to confirm against the live site.</p>';
    }

    body += '<div class="label">Not right? Tell the agent what to change</div>' +
      '<textarea id="feedback-' + sid + '" placeholder="' +
        (kind === 'scraper' ? 'e.g. the transactions POST still returns 403'
                            : 'e.g. the Amount column is losing negatives on refunds') + '">' +
      esc(st.feedback || '') + '</textarea>' +
      '<div class="row" style="margin-top:10px">' +
      (st.passed
        ? (kind === 'scraper'
            // Scrapers self-register — there is no activation step to approve.
            ? '<button class="btn primary" onclick="runScraperAfterFix(\'' + s.key + '\')">Run the scraper now</button>'
            : '<button class="btn primary" onclick="approveBuild(\'' + s.key + '\')">Approve &amp; activate</button>')
        : '') +
      '<button class="btn" onclick="reviseBuild(\'' + s.key + '\')">' +
        (kind === 'scraper' ? 'Fix it again' : 'Revise with the agent') + '</button>' +
      '<button class="btn" onclick="resetBuild(\'' + s.key + '\')">Dismiss</button>' +
      '</div>';
    return body;
  }

  async function runScraperAfterFix(key) {
    resetBuild(key);
    await act('run_scraper', { source_key: key });
  }

  function chooseSample(key) { const i = el('sample-input-' + sourceDomId(key)); if (i) i.click(); }

  async function handleSampleFile(key, event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    clearToast();
    toast('Saving ' + file.name + '…', true);
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/upload_sample/' + encodeURIComponent(key), { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.detail && data.detail.message) || data.detail || 'upload failed');
      bs(key).sample = data;
      toast('Sample saved. Ready to build.', true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t save the sample: ' + e.message, false);
    } finally {
      if (input) input.value = '';
    }
  }

  async function startBuild(key, mode) {
    const st = bs(key);
    const kind = st.kind || 'parser';
    // Only a parser is built FROM a document; a scraper revise works from the
    // harness's own failure logs, so it needs no sample.
    if (kind === 'parser' && !st.sample) { toast('Choose a sample document first.', false); return; }
    clearToast();
    const args = { kind, source_key: key, mode: mode || 'build' };
    if (kind === 'parser') args.sample_path = st.sample.sample_path;
    if (mode === 'revise') args.feedback = st.feedback || '';
    // Reuse the demonstration just captured rather than asking for another one.
    const demo = demoState[key];
    if (kind === 'scraper' && demo && demo.demo_path) args.demo_path = demo.demo_path;
    try {
      await callTool('start_build', args);
      st.status = 'running'; st.events = []; st.result = null; st.passed = false;
      st.blockers = []; st.did = null; st.message = null;
      st.token = (st.token || 0) + 1;
      await renderIngest();
      pollBuild(key, st.token);
    } catch (e) {
      toast('Couldn’t start the build: ' + e.message, false);
    }
  }

  function pollBuild(key, token) {
    const tick = async () => {
      const st = bs(key);
      if (st.token !== token) return;            // a newer build superseded this one
      let s;
      try {
        s = await callTool('build_status', { source_key: key, event_offset: st.events.length });
      } catch (e) {
        st.status = 'failed'; st.message = 'Lost contact with the build: ' + e.message;
        await renderIngest();
        return;
      }
      if (st.token !== token) return;
      if (s.events && s.events.length) st.events = st.events.concat(s.events);

      const wasStalled = !!st.stalled, wasQuiet = (st.idle_seconds || 0) >= 20;
      if (s.status === 'running') {
        // Update only the stream so typing/scroll elsewhere isn't disturbed.
        const host = el('stream-' + sourceDomId(key));
        if (host) {
          const shown = st.events.slice(-40);
          host.innerHTML = shown.map((e, i) =>
            '<span class="' + (i === shown.length - 1 ? 'last' : '') + '">' + esc(e) + '</span>').join('\n');
          host.scrollTop = host.scrollHeight;
        } else {
          await renderIngest();
        }
        st.idle_seconds = s.idle_seconds || 0;
        st.stalled = !!s.stalled;
        st.last_event = s.last_event || '';
        // The quiet notice lives outside the stream, so it needs a re-render to
        // appear — but only when its state actually changed, or typing would be
        // interrupted every two seconds.
        if (st.stalled !== wasStalled || (st.idle_seconds >= 20) !== wasQuiet) await renderIngest();
        setTimeout(tick, 2000);
        return;
      }

      st.status = s.status;
      st.result = s.result || null;
      st.passed = !!s.passed;
      st.blockers = s.blockers || [];
      st.did = s.did || null;
      st.message = s.message || null;
      if (s.status === 'completed') {
        toast(s.passed ? 'Build finished and its test passed — review it below.'
                       : ('Not approvable: ' + (st.blockers[0] || 'the build was refused.')),
              !!s.passed);
      } else {
        toast('Build failed: ' + (s.message || 'unknown error'), false);
      }
      await loadStatus();
      forgetSource(key);
      await renderIngest();
    };
    setTimeout(tick, 1500);
  }

  function fmtIdle(seconds) {
    const s = Math.round(seconds);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
  }

  /** The escape hatch that didn't exist: a wedged build could only be killed from
   *  a terminal. Whatever it already wrote stays on disk. */
  async function stopBuild(key) {
    clearToast();
    try {
      const r = await callTool('stop_build', { source_key: key });
      toast(r.message || 'Stopped.', true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t stop it: ' + e.message, false);
    }
  }

  function readFeedback(key) {
    const t = el('feedback-' + sourceDomId(key));
    return t ? t.value.trim() : '';
  }

  async function reviseBuild(key) {
    const st = bs(key);
    const fb = readFeedback(key);
    // A scraper revise reads the failure logs, so feedback is optional there;
    // a parser revise has nothing to go on but what the operator says.
    if (!fb && (st.kind || 'parser') === 'parser') {
      toast('Say what needs changing first.', false);
      return;
    }
    st.feedback = fb;
    await startBuild(key, 'revise');
  }

  async function approveBuild(key) {
    bs(key).feedback = readFeedback(key);
    await act('activate_parser', { source_key: key });
    resetBuild(key);
  }

  function resetBuild(key) {
    const st = bs(key);
    st.status = 'idle'; st.events = []; st.result = null; st.passed = false;
    st.blockers = []; st.did = null; st.message = null;
    st.token = (st.token || 0) + 1;   // orphan any in-flight poller
    renderIngest();
  }

  function faithfulCols(rows) { return rows.length ? Object.keys(rows[0].fields || {}) : []; }

  function txnTableHTML(rows) {
    if (!rows.length) return '<div class="empty">No rows match.</div>';
    const cols = faithfulCols(rows);
    if (!cols.length) return '<div class="empty">No columns to show.</div>';
    const head = cols.map(c => '<th class="' + (c === 'Amount' ? 'amt' : '') + '">' + esc(c) + '</th>').join('');
    const body = rows.map(t => '<tr>' + cols.map(c => {
      const v = (t.fields || {})[c];
      if (c === 'Amount') { const n = parseFloat(v); return '<td class="amt ' + (n < 0 ? 'neg' : 'pos') + '">' + (isNaN(n) ? esc(v) : money(n)) + '</td>'; }
      return '<td title="' + esc(v) + '">' + esc(v) + '</td>';
    }).join('') + '</tr>').join('');
    return '<div class="tbl-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function validationHTML(key, data) {
    const view = svState(key);
    const rowsAll = data.transactions || [];
    const cols = faithfulCols(rowsAll);
    const net = netOf(data);
    const strip = '<div class="kstrip">' +
      '<div class="k"><div class="l">Money in</div><div class="v pos">' + money(data.money_in || 0) + '</div></div>' +
      '<div class="k"><div class="l">Money out</div><div class="v neg">' + money(data.money_out || 0) + '</div></div>' +
      '<div class="k"><div class="l">Net</div><div class="v ' + (net < 0 ? 'neg' : 'pos') + '">' + money(net) + '</div></div>' +
      '<div class="k"><div class="l">Rows</div><div class="v">' + (data.count || 0) + '</div></div></div>';

    // Model-read data must not look identical to parsed data. Nothing verified
    // it, and the fix (build a parser) is one panel below.
    const byModel = data.extraction_method === 'llm_extract' || data.extraction_method === 'llm_fallback';
    // …and it names WHICH model, recorded at the time it ran. Settings can
    // change afterwards; what read these rows cannot.
    const readBy = data.model ? ' Read by <b>' + esc(data.model) + '</b>.' : '';
    const provenance = byModel
      ? '<div class="notbuilt" style="margin-bottom:12px"><b>Read by the model, not by a parser.</b> ' +
        (data.extraction_method === 'llm_fallback'
          ? 'The committed parser couldn’t read that layout, so the model read it instead. '
          : 'This source has no parser yet, so the model read it. ') +
        'Nothing tested this — check the rows below, and have the agent build a parser so next month ' +
        'is deterministic.' + readBy + '</div>'
      : '';

    const groupSafe = cols.includes(view.group) ? view.group : 'None';
    const opts = ['None'].concat(cols).map(o =>
      '<option value="' + esc(o) + '"' + (o === groupSafe ? ' selected' : '') + '>' + (o === 'None' ? 'None (flat ledger)' : esc(o)) + '</option>').join('');
    const controls = '<div class="controls">' +
      '<div class="grp">Group by <select onchange="setSourceGroup(\'' + key + '\',this.value)">' + opts + '</select></div>' +
      '<input type="search" placeholder="Search this source…" value="' + esc(view.query) + '" oninput="setSourceQuery(\'' + key + '\',this.value)">' +
      '<span class="hint">columns are this source’s own</span></div>';

    // filter
    let rows = rowsAll.slice();
    if (view.query.trim()) {
      const q = view.query.toLowerCase();
      rows = rows.filter(t => Object.values(t.fields || {}).some(v => String(v).toLowerCase().includes(q)));
    }

    let bodyHTML;
    if (groupSafe === 'None') {
      bodyHTML = txnTableHTML(rows);
    } else {
      const g = {};
      rows.forEach(t => { const gk = (t.fields || {})[groupSafe] || '—'; (g[gk] = g[gk] || []).push(t); });
      const keys = Object.keys(g).sort((a, b) => g[b].length - g[a].length);
      bodyHTML = '<div class="tbl-wrap">' + (keys.length ? keys.map((gk, i) => {
        const gnet = g[gk].reduce((sum, t) => sum + t.amount, 0);
        return '<div class="rollup" id="ru_' + sourceDomId(key) + '_' + i + '">' +
          '<div class="rollup-h" onclick="toggleRollup(\'' + key + '\',' + i + ')">' +
            '<span><span class="caret">&#8250;</span> <b>' + esc(gk) + '</b><span class="cnt">' + g[gk].length + ' rows</span></span>' +
            '<span class="' + (gnet < 0 ? 'neg' : 'pos') + '">' + money(gnet) + '</span></div>' +
          '<div class="rollup-body">' + txnTableHTML(g[gk]) + '</div></div>';
      }).join('') : '<div class="empty">No rows match.</div>') + '</div>';
    }
    return provenance + strip + controls + bodyHTML;
  }

  function toggleRollup(key, i) { const r = el('ru_' + sourceDomId(key) + '_' + i); if (r) r.classList.toggle('open'); }

  function setSourceGroup(key, value) { svState(key).group = value.startsWith('None') ? 'None' : value; renderDetailInPlace(key); }
  function setSourceQuery(key, value) { svState(key).query = value; renderDetailInPlace(key, true); }

  function renderDetailInPlace(key, keepFocus) {
    const data = sourceTxnCache[key];
    const holder = el('detail-' + sourceDomId(key));
    if (!holder || !data || !data.transactions || !data.transactions.length) return;
    const active = document.activeElement;
    const wasSearch = active && active.type === 'search';
    const caret = wasSearch ? active.selectionStart : null;
    holder.innerHTML = validationHTML(key, data);
    if (keepFocus && wasSearch) {
      const ns = holder.querySelector('input[type=search]');
      if (ns) { ns.focus(); try { ns.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  /** `withButton: false` when "Get latest" already IS the upload action — the
   *  file picker still has to exist in the DOM, but a second button that opens
   *  the same dialog is just noise. */
  function sourceUploadAction(sourceKey, withButton = true) {
    const sid = sourceDomId(sourceKey);
    return '<div class="src-actions">' +
      (withButton ? '<button class="btn" onclick="chooseUpload(\'' + sourceKey + '\')">Upload file</button>' : '') +
      '<input id="upload-input-' + sid + '" type="file" style="display:none" accept=".pdf,.csv,text/csv,application/pdf" onchange="handleUploadFile(\'' + sourceKey + '\', event)" />' +
      '<div class="upload-progress" id="upload-progress-' + sid + '" style="display:none">' +
      '<progress id="upload-bar-' + sid + '" max="100" value="0"></progress>' +
      '<span id="upload-pct-' + sid + '">0%</span>' +
      '</div></div>';
  }

  function sourceUploadStepsRow(sourceKey) {
    const sid = sourceDomId(sourceKey);
    return '<div class="upload-steps-row" id="upload-steps-row-' + sid + '"><div class="upload-steps" id="upload-steps-' + sid + '"></div></div>';
  }

  function chooseUpload(sourceKey) {
    const input = el('upload-input-' + sourceDomId(sourceKey));
    if (input) input.click();
  }

  function handleUploadFile(sourceKey, event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    uploadIngest(sourceKey, file).finally(() => {
      if (input) input.value = '';
    });
  }

  function uploadIngest(sourceKey, file) {
    clearToast();
    setSourceButtonsDisabled(true);
    const runId = startActionRun(sourceKey, 'upload_ingest');
    const sid = sourceDomId(sourceKey);
    const progressWrap = el('upload-progress-' + sid);
    const progressBar = el('upload-bar-' + sid);
    const progressPct = el('upload-pct-' + sid);
    if (progressWrap) progressWrap.style.display = 'flex';
    if (progressBar) progressBar.value = 0;
    if (progressPct) progressPct.textContent = '0%';
    let steps = defaultUploadSteps(file.name);
    steps = updateUploadStep(steps, 'upload_to_server', 'in-progress', 'Upload to server (0%)');
    renderUploadSteps(sourceKey, steps);
    toast('Uploading ' + file.name + '… 0%', true);

    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload_ingest/' + encodeURIComponent(sourceKey));

      xhr.upload.onprogress = (evt) => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        if (!evt.lengthComputable) return;
        const pct = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
        if (progressBar) progressBar.value = pct;
        if (progressPct) progressPct.textContent = pct + '%';
        steps = updateUploadStep(steps, 'upload_to_server', 'in-progress', 'Upload to server (' + pct + '%)');
        renderUploadSteps(sourceKey, steps);
        toast('Uploading ' + file.name + '… ' + pct + '%', true);
      };

      xhr.onerror = () => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        steps = updateUploadStep(steps, 'upload_to_server', 'failed', 'Upload to server', 'Network error');
        renderUploadSteps(sourceKey, steps);
        toast('upload_ingest failed: network error', false);
        if (progressWrap) progressWrap.style.display = 'none';
        setSourceButtonsDisabled(false);
        reject(new Error('Network error'));
      };

      xhr.onload = async () => {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        let payload = {};
        try {
          payload = xhr.responseText ? JSON.parse(xhr.responseText) : {};
        } catch {
          payload = {};
        }

        if (xhr.status >= 200 && xhr.status < 300) {
          steps = updateUploadStep(steps, 'upload_to_server', 'success', 'Upload to server (100%)');
          steps = applyServerUploadSteps(steps, payload.steps);
          steps = updateUploadStep(steps, 'done', 'success', 'Complete');
          renderUploadSteps(sourceKey, steps);
          if (progressBar) progressBar.value = 100;
          if (progressPct) progressPct.textContent = '100%';
          toast('upload_ingest done' + (payload.count != null ? ' — ' + payload.count + ' transactions' : '') + '.', true);
          await loadStatus();
          forgetSource(sourceKey);
          if (current === 'ingest') await renderIngest();
          resolve(payload);
        } else {
          const detail = payload && payload.detail ? payload.detail : ('HTTP ' + xhr.status);
          const detailMessage = detail && detail.message ? detail.message : detail;
          const serverSteps = detail && detail.steps ? detail.steps : [];
          steps = updateUploadStep(steps, 'upload_to_server', 'success', 'Upload to server (100%)');
          steps = applyServerUploadSteps(steps, serverSteps);
          if (!serverSteps.length) steps = updateUploadStep(steps, 'done', 'failed', 'Complete', String(detailMessage));
          else steps = updateUploadStep(steps, 'done', 'failed', 'Complete');
          renderUploadSteps(sourceKey, steps);
          toast('upload_ingest failed: ' + detailMessage, false);
          if (progressWrap) progressWrap.style.display = 'none';
          setSourceButtonsDisabled(false);
          // The server kept the document precisely because a retry is possible:
          // offer the model rather than leaving the operator at a dead end.
          if (detail && detail.retry_path) {
            llmOffer[sourceKey] = { mode: 'fallback', path: detail.retry_path,
                                    filename: detail.filename || file.name };
            if (current === 'ingest') await renderIngest();
          }
          reject(new Error(detailMessage));
        }
      };

      const form = new FormData();
      form.append('file', file);
      xhr.send(form);
    });
  }

  function renderProcess() {
    setPanel('<div class="empty">Data processing — categorization, reconciliation, and P&amp;L — isn’t built yet. ' +
      'It’s deliberately deferred: ingested transactions are stored faithfully first.</div>', 'process');
  }

  // ── Settings: which LLM the harness drives. Stored encrypted in .secrets/. ──
  const llmForm = { provider: null, models: [] };

  async function renderSettings() {
    setPanelLoading('<div class="empty">Loading settings…</div>', 'settings');
    let cfg = {};
    try { cfg = await callTool('llm_status'); } catch (e) { cfg = { error: e.message }; }
    if (!credCache) await loadCredentials();
    if (llmForm.provider === null) llmForm.provider = cfg.provider || 'anthropic';

    // `model` here is what will ACTUALLY run, not just what was typed into the
    // field: a provider saved without one still runs something, and a screen
    // that stayed blank while a built-in default ran is a black box.
    const modelNote = cfg.model_source === 'default'
      ? ' <span class="sub">(built-in default — nothing chosen yet)</span>'
      : (cfg.model_source === 'environment' ? ' <span class="sub">(from the environment)</span>' : '');
    const currently = cfg.configured
      ? 'Currently: <b>' + esc(cfg.provider === 'anthropic' ? 'Claude API' : 'Local / OpenAI-compatible') + '</b>' +
        (cfg.model ? ' · <b>' + esc(cfg.model) + '</b>' + modelNote : '') +
        (cfg.base_url ? ' · ' + esc(cfg.base_url) : '') +
        '<div class="sub" style="margin-top:4px">Every model call the harness makes — reading a ' +
        'document, suggesting a name, building a parser — uses this one.</div>'
      : 'No LLM provider is set up yet.';

    const seg = '<div class="seg">' +
      '<button class="' + (llmForm.provider === 'anthropic' ? 'on' : '') + '" onclick="pickProvider(\'anthropic\')">Claude API</button>' +
      '<button class="' + (llmForm.provider === 'openai_compatible' ? 'on' : '') + '" onclick="pickProvider(\'openai_compatible\')">Local server</button>' +
      '</div>';

    // A key already in the vault never has to be retyped: leaving the field
    // blank keeps it. Only the fact that one is stored is shown, never its value.
    const sameProvider = cfg.provider === llmForm.provider;
    const keyStored = !!cfg.api_key_set && sameProvider;
    const keyHint = keyStored
      ? '<span class="sub">A key is already saved in .secrets/ — leave blank to keep it, or type a new one to replace it.</span>'
      : '<span class="sub">Stored encrypted in .secrets/ — never written into the repo.</span>';
    const keyPlaceholder = keyStored ? '•••••••••••• saved' : 'sk-ant-…';

    let form;
    if (llmForm.provider === 'anthropic') {
      form =
        '<div class="field"><label for="llm-key">Anthropic API key</label>' +
        '<input type="password" id="llm-key" placeholder="' + keyPlaceholder + '" autocomplete="off">' +
        keyHint + '</div>' +
        '<div class="field"><label for="llm-model">Model</label>' +
        '<input type="text" id="llm-model" value="' +
        esc(sameProvider && cfg.model ? cfg.model : ((cfg.defaults || {}).anthropic || '')) + '"></div>';
    } else {
      const opts = llmForm.models.length
        ? '<div class="field"><label for="llm-model-sel">Model</label><select id="llm-model-sel">' +
          llmForm.models.map(m => '<option' + (sameProvider && m === cfg.model ? ' selected' : '') + '>' + esc(m) + '</option>').join('') +
          '</select><span class="sub">Listed live from that server.</span></div>'
        : '';
      const baseVal = (sameProvider && cfg.base_url) ? cfg.base_url : 'http://klabss-MacBook-Pro.local:9090/v1';
      form =
        '<div class="field"><label for="llm-base">Base URL</label>' +
        '<input type="text" id="llm-base" value="' + esc(baseVal) + '"></div>' +
        '<div class="field"><label for="llm-key">API key <span class="sub">(optional for local servers)</span></label>' +
        '<input type="password" id="llm-key" placeholder="' + (keyStored ? '•••••••••••• saved' : 'usually blank for a local server') + '" autocomplete="off">' +
        (keyStored ? keyHint : '') + '</div>' +
        '<div class="row" style="margin-bottom:12px"><button class="btn" onclick="loadLlmModels()">List models on that server</button></div>' +
        opts +
        (llmForm.models.length ? '' :
          '<div class="field"><label for="llm-model">Model</label><input type="text" id="llm-model" value="' +
          esc(sameProvider && cfg.model ? cfg.model : '') + '" placeholder="type it exactly, or list them above"></div>');
    }

    setPanel(
      '<div class="setting"><h2>LLM provider</h2>' +
      '<p class="note">Which model the harness uses to build parsers/scrapers and extract data.</p>' +
      '<div class="kv">' + currently + '</div>' + seg + form +
      '<div class="row"><button class="btn" onclick="saveLlmProvider()">Save provider</button></div></div>' +
      credentialsHTML(), 'settings');
  }

  // ── The sign-ins, grouped by TYPE and collapsed like the data sources ─────
  // Presence only: a screen that can show a stored password is a screen that can
  // leak one. You can replace a credential; nothing reads one back out.
  let credCache = null;
  const credSectionOpen = { websites: true, email: true };
  const credOpen = {};        // source_key -> expanded?

  function credentialsHTML() {
    if (!credCache) return '<div class="setting"><p class="note">Loading sign-ins…</p></div>';
    const websites = credCache.filter(c => c.kind !== 'inbox');
    const inboxes = credCache.filter(c => c.kind === 'inbox');

    return credSectionHTML('websites', 'Websites', websites.length,
             websites.map(websiteHTML).join('') ||
             '<p class="note" style="margin:0">No source signs in to a website yet.</p>') +
           credSectionHTML('email', 'Email', inboxes.length,
             inboxes.map(inboxHTML).join('') + addInboxHTML());
  }

  /** One type of sign-in. Collapsible, with the count on the header, so the page
   *  reads as a short list of kinds rather than a wall of forms. */
  function credSectionHTML(id, title, count, body) {
    const open = !!credSectionOpen[id];
    return '<div class="setting">' +
      '<div class="build-h" style="padding:0;background:none;border:0" ' +
        'onclick="toggleCredSection(\'' + id + '\')">' +
      '<span class="caret' + (open ? ' open' : '') + '">&#8250;</span><b>' + esc(title) + '</b>' +
      '<span class="hint" style="margin-left:auto;font-weight:400">' + count + '</span></div>' +
      (open ? '<div style="margin-top:12px">' + body + '</div>' : '') + '</div>';
  }

  function toggleCredSection(id) { credSectionOpen[id] = !credSectionOpen[id]; renderSettings(); }
  function toggleCred(key) { credOpen[key] = !credOpen[key]; renderSettings(); }

  /** A collapsed sign-in shows only what you'd scan for: who it is, whether it's
   *  set up, and where it signs in. The fields appear when you open it. */
  function credRowHTML(key, label, badge, aside, body) {
    const open = !!credOpen[key];
    return '<div class="cred">' +
      '<div class="cred-h" style="cursor:pointer" onclick="toggleCred(\'' + key + '\')">' +
      '<span class="caret' + (open ? ' open' : '') + '">&#8250;</span><b>' + esc(label) + '</b>' + badge +
      (aside ? '<span class="hint" style="margin-left:auto">' + aside + '</span>' : '') +
      '</div>' + (open ? body : '') + '</div>';
  }

  function websiteHTML(c) {
    const sid = sourceDomId(c.key);
    const stored = c.has_username && c.has_password;
    const badge = stored
      ? '<span class="verdict pass" style="font-size:11.5px;padding:2px 9px">saved</span>'
      : '<span class="tag">not set up</span>';
    const body =
      '<div class="field"><label for="cu-' + sid + '">Username or email</label>' +
      '<input type="text" id="cu-' + sid + '" value="' + esc(c.username) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="cp-' + sid + '">Password</label>' +
      '<input type="password" id="cp-' + sid + '" autocomplete="off" placeholder="' +
        (c.has_password ? '•••••••••••• saved' : 'not set') + '">' +
      '<span class="sub">' + (c.has_password ? 'Leave blank to keep the saved one. ' : '') +
      'Stored encrypted in <b>.secrets/</b> — never in the repo, never shown back to you.</span></div>' +
      '<div class="row"><button class="btn" onclick="saveCredentials(\'' + c.key + '\')">' +
        (stored ? 'Update' : 'Save') + '</button>' +
      (stored ? '<button class="btn" onclick="forgetCredentials(\'' + c.key + '\')">Forget</button>' : '') +
      '</div>';
    return credRowHTML(c.key, c.label, badge, c.login_url ? esc(c.login_url) : '', body);
  }

  /** No name asked for: signing in is the point, and the address is the obvious
   *  name — which Google only tells us at consent. So this is one button. */
  function addInboxHTML() {
    return '<div class="row" style="margin-top:2px">' +
      '<button class="btn" onclick="addInbox()">Add mailbox</button></div>';
  }

  async function addInbox() {
    clearToast();
    try {
      const st = await callTool('add_inbox', {});
      emailCache[st.source_key] = st;
      credCache = null;
      await loadCredentials();
      credOpen[st.source_key] = true;
      startGmailSetup(st.source_key);        // straight into the walkthrough
    } catch (e) {
      toast('Couldn’t add it: ' + e.message, false);
    }
  }

  async function renameInbox(key) {
    const node = el('inbox-name-' + sourceDomId(key));
    const label = node ? node.value.trim() : '';
    if (!label) { toast('A mailbox needs a name — its address is a fine one.', false); return; }
    clearToast();
    try {
      emailCache[key] = await callTool('rename_inbox', { source_key: key, label });
      credCache = null;
      await loadCredentials();
      await renderSettings();
      toast('Renamed to ' + label + '.', true);
    } catch (e) {
      toast('Couldn’t rename it: ' + e.message, false);
    }
  }

  async function reapproveInbox(key) {
    clearToast();
    try {
      await callTool('reapprove_inbox', { source_key: key });
      consentState[key] = { status: 'running', message: 'A browser is opening — click Allow again.' };
      await renderSettings();
      pollConsent(key);
    } catch (e) {
      toast('Couldn’t start that: ' + e.message, false);
    }
  }

  async function deleteInbox(key) {
    clearToast();
    try {
      const r = await callTool('delete_inbox', { source_key: key });
      delete emailCache[key];
      credCache = null;
      await loadCredentials();
      await renderSettings();
      toast('Deleted ' + r.label + '. Its token is gone from .secrets/.', true);
    } catch (e) {
      toast(e.message, false);
    }
  }

  // ── An inbox signs in with Google, so there is no password to store: the
  // harness gets a refresh token through a consent screen. Upload the OAuth
  // client JSON → click Allow in the browser Google opens → say what to fetch.
  const emailCache = {};      // source_key -> email_status
  const consentState = {};    // source_key -> { status, message }

  function inboxHTML(c) {
    const sid = sourceDomId(c.key);
    const st = emailCache[c.key];
    const consent = consentState[c.key] || {};
    const picker = '<input type="file" accept=".json,application/json" style="display:none" ' +
      'id="oauth-input-' + sid + '" onchange="handleOauthClientFile(\'' + c.key + '\', event)">';
    if (!st) {
      return credRowHTML(c.key, c.label, '<span class="tag">loading…</span>', '', '');
    }

    const badge = st.connected
      ? '<span class="verdict pass" style="font-size:11.5px;padding:2px 9px">connected</span>'
      : '<span class="tag">not connected</span>';
    const aside = st.account_email ? esc(st.account_email) : '';

    // Mid-consent: the operator is in Google's window, so say only that.
    if (consent.status === 'running') {
      return credRowHTML(c.key, c.label, badge, aside,
        '<p class="note" style="margin:4px 0 0">' + esc(consent.message || 'Waiting for you to approve access…') + '</p>' +
        '<p class="sub">Google opened a browser window — pick the account this mailbox belongs to and ' +
        'click <b>Allow</b>.</p>' + picker);
    }

    const failed = consent.status === 'failed'
      ? '<p class="note" style="color:var(--danger)">' + esc(consent.message) + '</p>' : '';

    if (!st.connected) {
      // Not connected yet: either the intro, or whichever step of the setup
      // they're on. Never a bare button whose behaviour is a surprise.
      const body = oauthSetup.key === c.key
        ? gmailStepHTML(c)
        : '<p class="note" style="margin:4px 0 8px">Google signs this in, so there is no password to ' +
          'keep — the harness gets a read-only token instead. Workspace disabled app passwords for ' +
          'mail in May 2025, so this is the only way in. It takes five short steps in Google Cloud; ' +
          'the harness walks you through them one at a time.</p>' +
          '<div class="row"><button class="btn primary" onclick="startGmailSetup(\'' + c.key + '\')">' +
          'Set up Gmail access</button>' + deleteInboxButton(c, st) + '</div>';
      return credRowHTML(c.key, c.label, badge, aside, failed + body + picker);
    }

    // Connected: its name (the address by default), what it's used for, and the
    // three things you can do to it.
    const nameField =
      '<div class="field"><label for="inbox-name-' + sid + '">Name</label>' +
      '<input type="text" id="inbox-name-' + sid + '" value="' + esc(c.label) + '" autocomplete="off">' +
      '<span class="sub">The address it signed in as, unless you give it a nickname — handy once ' +
      'there is more than one.</span></div>' +
      '<div class="row" style="margin-bottom:10px">' +
      '<button class="btn" onclick="renameInbox(\'' + c.key + '\')">Save name</button></div>';
    const controls = '<div class="row">' +
      '<button class="btn" onclick="reapproveInbox(\'' + c.key + '\')">Re-approve access</button>' +
      deleteInboxButton(c, st) + '</div>' +
      '<p class="sub">Re-approve when the token expires or you revoke it at ' +
      'myaccount.google.com/permissions — the harness kept this mailbox’s OAuth client, so there is ' +
      'no file to download again.</p>';
    return credRowHTML(c.key, c.label, badge, aside,
      failed + inboxUsersHTML(st) + nameField + controls + picker);
  }

  /** Deleting a mailbox that a source still arrives through would leave that
   *  source with a route to nowhere, so the button says so instead of failing
   *  after the click. */
  function deleteInboxButton(c, st) {
    const users = st.searched_by || [];
    if (users.length) {
      return '<button class="btn" disabled title="Used by ' +
        esc(users.map(u => u.label).join(', ')) + '">Delete — in use</button>';
    }
    return '<button class="btn" onclick="deleteInbox(\'' + c.key + '\')">Delete this mailbox</button>';
  }

  // ── Connecting a Gmail/Workspace inbox, one step at a time ────────────────
  // The terminal version walked the operator through the Google Cloud side of
  // this, and it is genuinely fiddly: a project, an enabled API, a consent
  // screen, a Desktop client, a downloaded file. A single unlabelled button that
  // silently opened a file picker was the regression this replaces.
  const oauthSetup = { key: null, step: 0 };    // which inbox, and how far in

  const GMAIL_STEPS = [
    {
      title: 'Create a Google Cloud project',
      body: 'Open <b>console.cloud.google.com</b> and create a project — any name will do ' +
            '(e.g. <i>k-realty-agent</i>). It only exists to hold the credential.',
      link: 'https://console.cloud.google.com/projectcreate',
      link_label: 'Open Google Cloud → new project',
    },
    {
      title: 'Turn on the Gmail API',
      body: 'In that project: <b>APIs &amp; Services → Library</b>, search for <b>Gmail API</b>, ' +
            'and press Enable. Without this the sign-in will succeed and then every read fails.',
      link: 'https://console.cloud.google.com/apis/library/gmail.googleapis.com',
      link_label: 'Open the Gmail API page',
    },
    {
      title: 'Fill in the consent screen',
      body: '<b>APIs &amp; Services → OAuth consent screen</b>. For a Workspace account choose ' +
            'user type <b>Internal</b>, then add the scope <b>.../auth/gmail.readonly</b> — ' +
            'read-only, so nothing here can send or delete mail.',
      link: 'https://console.cloud.google.com/apis/credentials/consent',
      link_label: 'Open the consent screen',
    },
    {
      title: 'Create an OAuth client',
      body: '<b>Credentials → Create credentials → OAuth client ID</b>, and pick application ' +
            'type <b>Desktop app</b>. Desktop matters: it is the type that can complete the ' +
            'approval on this machine.',
      link: 'https://console.cloud.google.com/apis/credentials',
      link_label: 'Open Credentials',
    },
    {
      title: 'Download the client file, then hand it over',
      body: 'On the client you just made, press the download button — it saves a small ' +
            '<b>.json</b> file. Choose that file below. A browser window then opens on Google’s ' +
            'own approval page: pick this mailbox and click <b>Allow</b>, once.',
      file: true,
    },
  ];

  function startGmailSetup(key) { oauthSetup.key = key; oauthSetup.step = 0; renderSettings(); }
  function cancelGmailSetup() {
    const key = oauthSetup.key;
    oauthSetup.key = null; oauthSetup.step = 0;
    // A mailbox added by pressing "Add mailbox" has no name and no token yet.
    // Backing out of the walkthrough should leave nothing behind.
    const st = key && emailCache[key];
    if (st && st.provisional && !st.connected) return deleteInbox(key);
    renderSettings();
  }
  function gmailStepBack() {
    if (oauthSetup.step === 0) return cancelGmailSetup();
    oauthSetup.step -= 1; renderSettings();
  }
  function gmailStepNext() {
    oauthSetup.step = Math.min(oauthSetup.step + 1, GMAIL_STEPS.length - 1); renderSettings();
  }

  function gmailStepHTML(c) {
    const i = oauthSetup.step;
    const step = GMAIL_STEPS[i];
    const dots = GMAIL_STEPS.map((_, n) =>
      '<span class="wstep' + (n === i ? ' on' : (n < i ? ' done' : '')) + '">' +
      '<span class="n">' + (n < i ? '&#10003;' : (n + 1)) + '</span></span>' +
      (n < GMAIL_STEPS.length - 1 ? '<span class="warrow">&#8250;</span>' : '')).join('');

    const link = step.link
      ? '<p class="note" style="margin:0 0 10px"><a href="' + step.link + '" target="_blank" rel="noopener">' +
        esc(step.link_label) + ' ↗</a> <span class="sub">(opens in your browser)</span></p>'
      : '';
    // The last step is the only one that touches a file, and it says so before
    // anything opens: no button whose behaviour you learn by pressing it.
    const act = step.file
      ? '<button class="btn primary" onclick="chooseOauthClient(\'' + c.key + '\')">' +
        'Choose the downloaded .json file…</button>'
      : '<button class="btn primary" onclick="gmailStepNext()">Done — next step</button>';

    return '<div class="wsteps" style="margin:6px 0 10px">' + dots + '</div>' +
      '<div class="lbl">Step ' + (i + 1) + ' of ' + GMAIL_STEPS.length + ' · ' + esc(step.title) + '</div>' +
      '<p class="note" style="margin:4px 0 10px">' + step.body + '</p>' + link +
      (step.file
        ? '<p class="sub" style="margin-bottom:10px">What is kept: the token and client id/secret, ' +
          'encrypted in <b>.secrets/</b>, never in the repo. The .json you choose is deleted as soon ' +
          'as approval finishes — a second plaintext copy of a client secret is pure downside.</p>'
        : '') +
      '<div class="row">' +
      '<button class="btn" onclick="gmailStepBack()">' + (i === 0 ? 'Cancel' : 'Back') + '</button>' +
      act + '</div>';
  }

  /** A connected inbox is ACCESS, and it's shared. Which messages matter is each
   *  source's own business, so this only says who uses it and links there. */
  function inboxUsersHTML(st) {
    const users = st.searched_by || [];
    if (!users.length) {
      return '<p class="note" style="margin:4px 0 0">Signed in and readable. Not used by any data ' +
        'source yet — that is set up on the source itself, under <b>Data ingestion</b>.</p>';
    }
    // WHICH data sources use this mailbox belongs here. WHAT each one searches
    // for does not — that is ingestion configuration, and it lives on the source.
    return '<p class="note" style="margin:4px 0 0">Signed in and readable.<br>' +
      'Used in <b>Data sources</b>: ' + users.map(u => esc(u.label)).join(', ') + '</p>';
  }

  function chooseOauthClient(key) { const i = el('oauth-input-' + sourceDomId(key)); if (i) i.click(); }

  async function handleOauthClientFile(key, event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    clearToast();
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/upload_oauth_client/' + encodeURIComponent(key), { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.detail && data.detail.message) || data.detail || 'upload failed');
      await callTool('start_gmail_consent', { source_key: key, client_secret_path: data.client_secret_path });
      consentState[key] = { status: 'running', message: 'A browser is opening — choose the account and click Allow.' };
      oauthSetup.key = null; oauthSetup.step = 0;    // the walkthrough is done
      await renderSettings();
      pollConsent(key);
    } catch (e) {
      consentState[key] = { status: 'failed', message: e.message };
      await renderSettings();
    } finally {
      if (input) input.value = '';   // so re-picking the same file still fires
    }
  }

  function pollConsent(key) {
    const tick = async () => {
      let s;
      try { s = await callTool('gmail_consent_status', { source_key: key }); }
      catch (e) {
        consentState[key] = { status: 'failed', message: 'Lost contact with the consent step: ' + e.message };
        await renderSettings();
        return;
      }
      if (s.status === 'running') {
        // Only the message changes while waiting; re-rendering would steal focus.
        consentState[key] = { status: 'running', message: s.message };
        setTimeout(tick, 1500);
        return;
      }
      consentState[key] = s.status === 'completed'
        ? {}
        : { status: 'failed', message: [s.message, s.remediation].filter(Boolean).join(' ') };
      await loadEmailStatus(key);
      // Now we know the address, so an unnamed mailbox names itself. A nickname
      // is offered on the card for anyone with more than one.
      if (s.status === 'completed' && s.account_email && (emailCache[key] || {}).provisional) {
        try { emailCache[key] = await callTool('rename_inbox', { source_key: key, label: s.account_email }); }
        catch (e) { /* it stays "New mailbox"; the name field is right there */ }
        credCache = null;
        await loadCredentials();
      }
      await renderSettings();
      if (s.status === 'completed') toast('Connected ' + (s.account_email || 'the inbox') + '.', true);
    };
    setTimeout(tick, 1200);
  }

  async function loadEmailStatus(key) {
    try { emailCache[key] = await callTool('email_status', { source_key: key }); }
    catch (e) { emailCache[key] = { connected: false, searched_by: [] }; }
  }

  async function loadCredentials() {
    try { credCache = await callTool('credential_status'); }
    catch (e) { credCache = []; }
    await Promise.all(credCache.filter(c => c.kind === 'inbox').map(c => loadEmailStatus(c.key)));
  }

  async function saveCredentials(key) {
    const sid = sourceDomId(key);
    clearToast();
    try {
      await callTool('set_credentials', {
        source_key: key,
        username: el('cu-' + sid).value,
        password: el('cp-' + sid).value,
      });
      toast('Sign-in saved for ' + key + '.', true);
      await loadCredentials();
      await renderSettings();
    } catch (e) {
      toast('Couldn’t save: ' + e.message, false);
    }
  }

  async function forgetCredentials(key) {
    clearToast();
    try {
      await callTool('forget_credentials', { source_key: key });
      toast('Sign-in removed.', true);
      await loadCredentials();
      await renderSettings();
    } catch (e) {
      toast('Couldn’t remove: ' + e.message, false);
    }
  }

  function pickProvider(p) { llmForm.provider = p; llmForm.models = []; renderSettings(); }

  async function loadLlmModels() {
    const base = el('llm-base').value;
    const key = el('llm-key').value;
    clearToast();
    toast('Listing models on ' + base + '…', true);
    try {
      const r = await callTool('list_llm_models', { base_url: base, api_key: key || null });
      if (!r.models || !r.models.length) { toast('That server reported no models.', false); return; }
      llmForm.models = r.models;
      await renderSettings();
      el('llm-base').value = base;
      if (key) el('llm-key').value = key;
      toast('Found ' + r.models.length + ' model' + (r.models.length > 1 ? 's' : '') + '.', true);
    } catch (e) {
      toast(e.message, false);
    }
  }

  async function saveLlmProvider() {
    clearToast();
    const args = { provider: llmForm.provider };
    const keyEl = el('llm-key');
    args.api_key = keyEl ? keyEl.value : null;
    if (llmForm.provider === 'openai_compatible') {
      args.base_url = el('llm-base').value;
      const sel = el('llm-model-sel');
      args.model = sel ? sel.value : (el('llm-model') ? el('llm-model').value : null);
    } else {
      args.model = el('llm-model') ? el('llm-model').value : null;
    }
    try {
      const r = await callTool('set_llm_provider', args);
      toast('LLM provider saved.' + (r.reused_stored_api_key ? ' Kept the API key already in the vault.' : ''), true);
      await loadStatus();
      llmForm.models = [];
      await renderSettings();
    } catch (e) {
      toast('Couldn’t save: ' + e.message, false);
    }
  }

  // Stop waiting after this long. Without a deadline a wedged worker — or an
  // 'idle' status after a server restart — polled forever showing "in-progress".
  const RECOVERY_DEADLINE_MS = 10 * 60 * 1000;

  function endRecovery(sourceKey, stepKey, message) {
    let latest = actionStepHistory[sourceKey] || defaultActionSteps('start_login_recovery');
    latest = updateUploadStep(latest, stepKey, 'failed', null, message);
    latest = updateUploadStep(latest, 'done', 'failed', 'Complete', message);
    renderUploadSteps(sourceKey, latest);
    toast(message, false);
    setSourceButtonsDisabled(false);
  }

  function beginLoginRecoveryPolling(sourceKey, runId, resumeTool, resumeArgs, deadline) {
    const until = deadline || (Date.now() + RECOVERY_DEADLINE_MS);
    const poll = async () => {
      if (!isCurrentActionRun(sourceKey, runId)) return;
      try {
        const status = await callTool('login_recovery_status', { source_key: sourceKey });
        if (!isCurrentActionRun(sourceKey, runId)) return;
        let latest = actionStepHistory[sourceKey] || defaultActionSteps('start_login_recovery');
        if (status && Array.isArray(status.steps)) {
          latest = applyServerUploadSteps(latest, status.steps);
        }

        // The browser never opened / already quit while the worker waits on.
        if (status && status.status === 'stuck') {
          renderUploadSteps(sourceKey, latest);
          endRecovery(sourceKey, 'launch_browser',
            status.message || 'The recovery browser isn’t running. Cancel and retry.');
          showRecoveryCancel(sourceKey);
          return;
        }
        // Nothing is being tracked — e.g. agent-web restarted since it started.
        if (status && status.status === 'idle') {
          endRecovery(sourceKey, 'user_login',
            'Login recovery is no longer being tracked (the server may have restarted). Run it again.');
          return;
        }
        if (Date.now() > until) {
          endRecovery(sourceKey, 'user_login',
            'Gave up waiting for the login to finish. If the browser is still open, finish signing in and ' +
            'close its window, then retry; otherwise cancel the recovery and start again.');
          showRecoveryCancel(sourceKey);
          return;
        }
        if (status && status.status === 'completed') {
          latest = updateUploadStep(latest, 'done', 'success', 'Complete');
          renderUploadSteps(sourceKey, latest);
          await loadStatus();
          forgetSource(sourceKey);
          if (current === 'ingest') await renderIngest();
          if (resumeTool) {
            // The original action failed only because the session was stale —
            // now that login is recovered, automatically continue it instead
            // of leaving the operator to notice and re-click it themselves.
            toast('Login recovered. Re-running ' + resumeTool + '…', true);
            await act(resumeTool, resumeArgs, { allowAutoRecovery: false });
          } else {
            setSourceButtonsDisabled(false);
          }
          return;
        }
        if (status && status.status === 'failed') {
            const failure = status && status.message ? status.message : 'login recovery failed';
            latest = updateUploadStep(latest, 'done', 'failed', 'Complete', failure);
          renderUploadSteps(sourceKey, latest);
          setSourceButtonsDisabled(false);
          return;
        }
        renderUploadSteps(sourceKey, latest);
        setTimeout(poll, 2000);
      } catch (err) {
        if (!isCurrentActionRun(sourceKey, runId)) return;
        endRecovery(sourceKey, 'user_login',
          'Lost contact with the recovery: ' + (err && err.message ? err.message : 'status check failed'));
      }
    };
    setTimeout(poll, 1200);
  }

  function showRecoveryCancel(sourceKey) {
    const row = el('upload-steps-row-' + sourceDomId(sourceKey));
    if (!row || row.querySelector('.recovery-cancel')) return;
    const wrap = document.createElement('div');
    wrap.className = 'row recovery-cancel';
    wrap.style.marginTop = '8px';
    wrap.innerHTML = '<button class="btn" onclick="cancelRecovery(\'' + sourceKey + '\')">' +
      'Cancel recovery &amp; release the browser profile</button>';
    row.appendChild(wrap);
  }

  async function cancelRecovery(sourceKey) {
    clearToast();
    try {
      await callTool('cancel_login_recovery', { source_key: sourceKey });
      toast('Recovery cancelled. You can run it again now.', true);
      actionStepHistory[sourceKey] = null;
      const row = el('upload-steps-row-' + sourceDomId(sourceKey));
      if (row) { row.style.display = 'none'; row.innerHTML = '<div class="upload-steps" id="upload-steps-' + sourceDomId(sourceKey) + '"></div>'; }
      setSourceButtonsDisabled(false);
      if (current === 'ingest') await renderIngest();
    } catch (e) {
      toast('Couldn’t cancel: ' + e.message, false);
    }
  }

  const REASON_LABEL = {
    two_factor: '2FA / verification code required',
    captcha: 'CAPTCHA presented',
    bad_credentials: 'Stored credentials rejected',
    login_form_not_found: 'Sign-in form not found on the page',
    page_timeout: 'Portal didn’t respond in time',
    session_expired: 'Saved session expired',
    unknown: 'Automated sign-in blocked',
  };

  /** The portal's own failure text, step errors included — what the classifier reads. */
  function recoveryTriggerText(err) {
    const detail = err && err.detail ? err.detail : null;
    const parts = [(detail && detail.message) || (err && err.message) || ''];
    if (detail && Array.isArray(detail.steps)) {
      for (const s of detail.steps) if (s && s.error) parts.push(String(s.error));
    }
    return parts.filter(Boolean).join(' | ');
  }

  /** Say WHY a human is needed, above the step timeline. */
  function showRecoveryReason(sourceKey, recovery) {
    if (!recovery || !recovery.explanation) return;
    const row = el('upload-steps-row-' + sourceDomId(sourceKey));
    if (!row) return;
    row.style.display = 'block';
    const old = row.querySelector('.recovery-why');
    if (old) old.remove();
    const why = document.createElement('div');
    why.className = 'recovery-why';
    why.innerHTML = '<b>Why you’re needed: ' + esc(REASON_LABEL[recovery.reason] || REASON_LABEL.unknown) +
      '</b><br>' + esc(recovery.explanation);
    row.insertBefore(why, row.firstChild);
  }

  function shouldAutoRecoverLogin(tool, err) {
    if (tool !== 'run_scraper') return false;
    const detail = err && err.detail ? err.detail : null;
    const msg = String((detail && detail.message) || (err && err.message) || '');
    const authLike = /(\b401\b|unauthor|session|login|credential|sign[\s-]?in|2fa|verification)/i;
    if (authLike.test(msg)) return true;
    const stepErrors = detail && Array.isArray(detail.steps)
      ? detail.steps.map(s => String(s && s.error ? s.error : '')).join(' | ')
      : '';
    return authLike.test(stepErrors);
  }

  /** Poll the phases INSIDE a long action so a silent 30-60s step becomes
   *  named progress. Stops when `stop.done` flips. */
  function followActionProgress(sourceKey, runId, stop) {
    const tick = async () => {
      if (stop.done || !isCurrentActionRun(sourceKey, runId)) return;
      try {
        const p = await callTool('action_progress', { source_key: sourceKey });
        if (stop.done || !isCurrentActionRun(sourceKey, runId)) return;
        if (p.steps && p.steps.length) {
          const host = el('upload-steps-' + sourceDomId(sourceKey));
          const row = el('upload-steps-row-' + sourceDomId(sourceKey));
          if (host && row) {
            row.style.display = 'block';
            host.innerHTML = p.steps.map((s, i) => {
              const secs = s.duration_ms != null ? (s.duration_ms / 1000).toFixed(1) + 's'
                : (s.status === 'in-progress' && p.current_elapsed_s != null && s.label === p.current
                    ? p.current_elapsed_s + 's' : '');
              const label = esc(s.label) + (secs ? ' (' + secs + ')' : '');
              const title = s.error ? ' title="' + esc(s.error) + '"' : '';
              return '<span class="upload-step ' + (s.status || 'pending') + '"' + title + '>' + label + '</span>' +
                (i < p.steps.length - 1 ? '<span class="upload-step-sep">&gt;</span>' : '');
            }).join('');
          }
        }
      } catch (e) { /* progress is best-effort; never fail the action over it */ }
      if (!stop.done) setTimeout(tick, 1000);
    };
    setTimeout(tick, 400);
  }

  async function act(tool, args, options = {}) {
    const allowAutoRecovery = options.allowAutoRecovery !== false;
    clearToast();
    setSourceButtonsDisabled(true);
    toast('Running ' + tool + '…', true);
    const sourceKey = args && args.source_key ? args.source_key : null;
    let runId = null;
    let steps = null;
    const stopProgress = { done: false };
    if (sourceKey) {
      runId = startActionRun(sourceKey, tool);
      steps = defaultActionSteps(tool);
      const first = steps.find(s => s.key !== 'done');
      if (first) {
        steps = updateUploadStep(steps, first.key, 'in-progress', first.label);
      }
      renderUploadSteps(sourceKey, steps);
      // These are the tools with phases worth watching live.
      if (tool === 'run_scraper' || tool === 'fetch_source') {
        followActionProgress(sourceKey, runId, stopProgress);
      }
    }

    try {
      const r = await callTool(tool, args);
      stopProgress.done = true;   // the action finished; stop tailing its phases
      if (sourceKey && runId && !isCurrentActionRun(sourceKey, runId)) return;
      if (steps) {
        if (r && Array.isArray(r.steps) && r.steps.length) {
          steps = applyServerUploadSteps(steps, r.steps);
        } else {
          const first = steps.find(s => s.status === 'in-progress') || steps.find(s => s.key !== 'done');
          if (first) steps = updateUploadStep(steps, first.key, 'success', first.label);
        }
        if (tool === 'start_login_recovery') {
          steps = updateUploadStep(steps, 'done', 'in-progress', 'Complete');
        } else {
          steps = updateUploadStep(steps, 'done', 'success', 'Complete');
        }
        renderUploadSteps(sourceKey, steps);
      }

      if (tool === 'start_login_recovery' && sourceKey) {
        beginLoginRecoveryPolling(sourceKey, runId);
      }

      // A shortfall against the source's own totals means the run "succeeded"
      // with incomplete data — the operator must hear that, not a green toast.
      const bal = r && r.reconciliation;
      if (bal && bal.ok === false) {
        const worst = (bal.discrepancies || []).slice(0, 3)
          .map(d => d.label + ': source ' + money(d.expected) + ' vs ours ' + money(d.actual)).join('; ');
        toast('⚠ ' + tool + ' ran, but ' + bal.discrepancies.length + ' of ' + bal.checked +
              ' totals did NOT balance — the data is incomplete. ' + worst, false);
      } else {
        toast(tool + ' done' + (r.count != null ? ' — ' + r.count + ' transactions' : '') +
              (bal && bal.ok === true ? ', reconciled against ' + bal.checked + ' source totals' : '') + '.', true);
      }
      await loadStatus();
      if (sourceKey) forgetSource(sourceKey);
      if (current === 'ingest') await renderIngest();
    } catch (e) {
      stopProgress.done = true;
      if (sourceKey && runId && !isCurrentActionRun(sourceKey, runId)) return;
      if (steps) {
        const detail = e && e.detail ? e.detail : null;
        const serverSteps = detail && Array.isArray(detail.steps) ? detail.steps : [];
        if (serverSteps.length) {
          steps = applyServerUploadSteps(steps, serverSteps);
        } else {
          const first = steps.find(s => s.status === 'in-progress') || steps.find(s => s.key !== 'done');
          if (first) steps = updateUploadStep(steps, first.key, 'failed', first.label, e && e.message ? e.message : 'failed');
        }
        steps = updateUploadStep(steps, 'done', 'failed', 'Complete', e && e.message ? e.message : 'failed');
        renderUploadSteps(sourceKey, steps);
      }

      if (allowAutoRecovery && sourceKey && shouldAutoRecoverLogin(tool, e)) {
        toast('Auth/session issue detected. Starting login recovery…', false);
        const recoveryRunId = startActionRun(sourceKey, 'start_login_recovery');
        let recoverySteps = defaultActionSteps('start_login_recovery');
        recoverySteps = updateUploadStep(recoverySteps, 'launch_browser', 'in-progress', 'Launch recovery browser');
        renderUploadSteps(sourceKey, recoverySteps);

        try {
          // Pass the failure that triggered this so the server can tell the
          // operator WHY a human is needed — a browser opening unexplained is
          // exactly the black box this project forbids.
          const recovery = await callTool('start_login_recovery', {
            source_key: sourceKey,
            trigger_error: recoveryTriggerText(e),
          });
          if (!isCurrentActionRun(sourceKey, recoveryRunId)) return;
          if (recovery && Array.isArray(recovery.steps)) {
            recoverySteps = applyServerUploadSteps(recoverySteps, recovery.steps);
          }
          recoverySteps = updateUploadStep(recoverySteps, 'done', 'in-progress', 'Complete');
          renderUploadSteps(sourceKey, recoverySteps);
          showRecoveryReason(sourceKey, recovery);
          toast('Recovery browser opened. Complete login in browser, then close it to save session.', true);
          // Once the operator finishes logging in, automatically re-run the
          // scraper call that originally failed — don't leave data un-pulled.
          beginLoginRecoveryPolling(sourceKey, recoveryRunId, tool, args);
          return;
        } catch (recoveryErr) {
          if (!isCurrentActionRun(sourceKey, recoveryRunId)) return;
          recoverySteps = updateUploadStep(
            recoverySteps,
            'done',
            'failed',
            'Complete',
            recoveryErr && recoveryErr.message ? recoveryErr.message : 'failed to start recovery'
          );
          renderUploadSteps(sourceKey, recoverySteps);
          toast('Automatic login recovery failed: ' + (recoveryErr && recoveryErr.message ? recoveryErr.message : 'unknown error'), false);
          setSourceButtonsDisabled(false);
          return;
        }
      }

      toast(tool + ' failed: ' + e.message, false);
      setSourceButtonsDisabled(false);
    }
  }

  const PAGEHEAD = {
    ingest: { h: 'Data sources', p: 'Acquire and validate each source before processing.' },
    process: { h: 'Process data', p: 'Categorize and reconcile ingested transactions — the second pillar.' },
    reporting: { h: 'Reporting', p: 'Cross-source summaries and statements — the third pillar.' },
    settings: { h: 'Settings', p: 'How the harness is wired up — the LLM it drives, and where secrets live.' },
  };

  function show(section) {
    // A different view IS a different page: start at the top. Within a view,
    // setPanel keeps the operator's position (see above).
    if (current !== section) { panelShowing = null; window.scrollTo(0, 0); }
    current = section;
    for (const s of ['reporting', 'ingest', 'process']) el('nav-' + s).classList.toggle('on', s === section);
    el('nav-settings').classList.toggle('on', section === 'settings');
    const ph = PAGEHEAD[section];
    el('pagehead').innerHTML = '<h1>' + ph.h + '</h1><p>' + ph.p + '</p>';
    clearToast();
    ({ reporting: renderReporting, ingest: renderIngest, process: renderProcess, settings: renderSettings })[section]();
  }

  setTheme(initialTheme());
  loadStatus();
  show('ingest');
</script>
</body>
</html>
