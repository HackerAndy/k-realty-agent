<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-Realty · property finance</title>
<style>
  :root {
    --bg: #faf9f5; --card: #ffffff; --border: #e7e5df; --text: #1c1b19;
    --muted: #6b6a64; --accent: #3b6d3b; --danger: #a3312d; --success: #2c6a3a;
    --radius: 10px;
    --accent-soft: #e9f1e7; --faint: #9a9c92;
    --shadow: 0 1px 2px rgba(28,27,25,.05), 0 6px 20px rgba(28,27,25,.06);
  }
  :root[data-theme="dark"] {
    --bg: #161818; --card: #202325; --border: #34393d; --text: #e8ecef;
    --muted: #a2abb2; --accent: #88c888; --danger: #f08a84; --success: #94d89f;
    --accent-soft: #26302a; --faint: #7c847c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip.warn { background: #fbf1e0; border-color: #e6d9b8; color: #855009; }
  :root[data-theme="dark"] .chip.warn { background: #3f3525; border-color: #6c5a3e; color: #f3c98f; }
  /* ── Top bar (brand + Input→Process→Report pills), from the accordion mockup ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  :root[data-theme="dark"] .brand .mark { color: #12160f; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .pillars { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .pillars button { font: inherit; font-size: 13px; border: none; background: transparent; color: var(--muted); padding: 7px 15px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .pillars button .step { font-size: 10px; font-weight: 700; color: var(--faint); }
  .pillars button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pillars button.on .step { color: var(--accent); }
  .pillars button:not(.on):hover { color: var(--text); }
  .topbar .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .pagehead { margin: 0 2px 18px; }
  .pagehead h1 { font-size: 20px; font-weight: 650; letter-spacing: -.015em; margin: 0; }
  .pagehead p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }

  button { font: inherit; cursor: pointer; }
  .btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; color: var(--text); font-size: 13px; }
  .btn:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .btn:hover { background: #292d30; }
  .btn:disabled { opacity: .55; cursor: default; }
  .icon-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .icon-btn:hover { background: #f2f1ec; color: var(--text); }
  :root[data-theme="dark"] .icon-btn:hover { background: #292d30; }
  .icon-btn.on { background: var(--accent-soft); color: var(--accent); }

  /* ── Settings form ── */
  .setting { padding: 16px; }
  .setting + .setting { border-top: 1px solid var(--border); }
  .setting h2 { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
  .setting .note { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; max-width: 460px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field select { font: inherit; font-size: 13px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .field .sub { font-size: 11.5px; color: var(--faint); }
  .seg { display: inline-flex; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .seg button { font-size: 13px; border: none; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kv { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .kv b { color: var(--text); font-weight: 600; }
  .cred { border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; background: color-mix(in oklab, var(--muted) 4%, var(--card)); }
  .cred-h { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-bottom: 10px; }
  .cred .field { margin-bottom: 10px; max-width: 400px; }
  .cred .hint { font-size: 11.5px; color: var(--faint); }
  .view {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .18s ease, transform .18s ease;
  }
  .view.is-hidden {
    display: none;
    opacity: 0;
    transform: translateY(6px);
  }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  thead th { border-top: none; color: var(--muted); font-weight: 500; }
  td.amt, th.amt { text-align: right; }
  .neg { color: var(--danger); }
  .pos { color: var(--success); }
  .src { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); font-size: 13px; }
  .src:first-child { border-top: none; }
  .src .meta { color: var(--muted); font-size: 12px; }
  .src-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 170px; }
  .src-actions .btn { width: fit-content; }
  .upload-progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .upload-progress progress { width: 120px; height: 8px; }
  .upload-steps-row { display: none; border-top: 1px dashed var(--border); padding: 8px 14px 11px 14px; }
  .upload-steps { display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; }
  .upload-step { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .upload-step::before { content: ''; width: 8px; height: 8px; border-radius: 999px; background: #b8b9b3; flex: 0 0 auto; }
  .upload-step.pending::before { background: #b8b9b3; }
  .upload-step.in-progress::before { background: #2f77d1; }
  .upload-step.success::before { background: var(--success); }
  .upload-step.failed::before { background: var(--danger); }
  .upload-step-sep { color: var(--muted); font-size: 12px; }
  .recovery-why { font-size: 12.5px; line-height: 1.55; color: var(--text); background: #fbf1e0; border: 1px solid #e6d9b8; border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; }
  .recovery-why b { display: inline-block; margin-bottom: 2px; }
  :root[data-theme="dark"] .recovery-why { background: #3f3525; border-color: #6c5a3e; color: #f3e2c4; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #eceae3; color: var(--muted); margin-left: 6px; }
  :root[data-theme="dark"] .tag { background: #2b3033; }

  /* ── Add a data source: three steps, and the box is the button ── */
  .wsteps { display: flex; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .wstep { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); }
  .wstep .n { width: 21px; height: 21px; border-radius: 999px; border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .wstep.on { color: var(--text); font-weight: 600; }
  .wstep.on .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .wstep.on .n { color: #12160f; }
  .wstep.done .n { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .warrow { color: var(--faint); margin: 0 12px; }

  .wopt { display: flex; align-items: center; gap: 11px; border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 13px; margin-bottom: 8px; cursor: pointer;
    background: color-mix(in oklab, var(--muted) 4%, var(--card)); }
  .wopt:hover { border-color: var(--accent); }
  .wopt.on { border-color: var(--accent); background: var(--accent-soft); }
  .wopt .wico { font-size: 16px; width: 20px; text-align: center; color: var(--muted); }
  .wopt .wradio { width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--border); flex: none; }
  .wopt.on .wradio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--card); }
  .wopt .t { font-weight: 600; font-size: 13px; }
  .wopt .d { color: var(--muted); font-size: 12px; }
  .wopt .w { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; text-align: right; }

  .wfound { border: 1px solid var(--border); border-radius: 10px; padding: 2px 14px;
    background: color-mix(in oklab, var(--muted) 4%, var(--card)); }
  .wfline { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0;
    border-top: 1px solid var(--border); font-size: 13px; }
  .wfline:first-child { border-top: none; }
  .wfline .k { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .wfline .v { text-align: right; }
  .wfline .v .tag { margin: 0 0 3px 4px; display: inline-block; }
  .empty { padding: 22px 14px; color: var(--muted); font-size: 13px; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-size: 13px;
    padding: 10px 16px;
    border-radius: var(--radius);
    display: none;
    z-index: 1000;
    max-width: min(90vw, 520px);
    text-align: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
  }
  #toast.ok { background: #e8f1e8; color: var(--success); display: block; }
  #toast.err { background: #f7e6e5; color: var(--danger); display: block; }
  :root[data-theme="dark"] #toast.ok { background: #223229; }
  :root[data-theme="dark"] #toast.err { background: #3d2828; }

  /* ── Ingest accordion (per-source acquire + validation) ── */
  .acc { display: flex; flex-direction: column; gap: 10px; }
  .accitem { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .accitem.open { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .acchead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .acchead:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .acchead:hover { background: #292d30; }
  .accitem.open .acchead { border-bottom: 1px solid var(--border); }
  .acchead .sdot { width: 8px; height: 8px; border-radius: 999px; flex: none; background: #b8b9b3; }
  .acchead .sdot.ready { background: var(--success); }
  .acchead .sdot.trig { background: #c99a3a; }
  .acchead .info { flex: 1; min-width: 0; }
  .acchead .nm { font-weight: 600; font-size: 14.5px; }
  .acchead .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .acchead .rt { text-align: right; font-size: 13px; }
  .acchead .rt .net { font-weight: 600; }
  .acchead .rt .netlbl { color: var(--muted); font-size: 11px; }
  .acchead .caret { color: var(--muted); font-size: 18px; transition: transform .12s; display: inline-block; }
  .accitem.open .caret { transform: rotate(90deg); }
  .accbody { padding: 16px; }
  .accbody .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }

  /* ── Funnel: several ways in, one body of data ── */
  .funnel { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 0; margin-bottom: 12px; }
  .doors { display: flex; flex-direction: column; gap: 8px; }
  .door { display: flex; align-items: center; gap: 9px; font-size: 12.5px; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; background: color-mix(in oklab, var(--muted) 5%, var(--card)); }
  .door.on { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); background: color-mix(in oklab, var(--accent) 10%, var(--card)); }
  .door.off { opacity: .55; }
  /* The whole box runs the route; only the star is carved out for setting default. */
  .door.go { cursor: pointer; }
  .door.go:hover { border-color: color-mix(in oklab, var(--accent) 55%, var(--border)); background: color-mix(in oklab, var(--accent) 8%, var(--card)); }
  .door.live .w { color: var(--text); font-weight: 600; }
  .door .t { font-weight: 600; }
  .door .w { color: var(--muted); font-size: 11.5px; margin-left: auto; text-align: right; }
  .door .star { font-size: 13px; width: 15px; flex: none; color: var(--accent); }
  .door .star.set { color: var(--border); cursor: pointer; }
  .door .star.set:hover { color: var(--accent); }
  .pipe { width: 58px; display: grid; place-items: center; color: var(--muted); opacity: .6; }
  .catch { padding-left: 10px; }
  .catch .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .catch .cap { color: var(--muted); font-size: 12px; }
  .verdict-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .verdict-txt { font-size: 12.5px; font-weight: 600; }
  .verdict-txt.self { color: var(--success); }
  .verdict-txt.manual { color: #9a6a12; }
  :root[data-theme="dark"] .verdict-txt.manual { color: #d7ab5c; }
  @media (max-width: 620px) { .funnel { grid-template-columns: 1fr; } .pipe { display: none; } .catch { padding: 10px 0 0; } }

  .kstrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .kstrip .k { background: var(--card); padding: 11px 13px; }
  .kstrip .k .l { font-size: 11.5px; color: var(--muted); }
  .kstrip .k .v { font-size: 18px; font-weight: 600; margin-top: 3px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .controls .grp { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .controls select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .controls input[type=search] { flex: 1; min-width: 170px; font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .controls .hint { font-size: 11.5px; color: var(--muted); }
  .tbl-wrap { border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  .tbl-wrap table td, .tbl-wrap table th { border-top: 1px solid var(--border); }
  .tbl-wrap thead th { background: color-mix(in oklab, var(--muted) 8%, var(--card)); position: sticky; top: 0; }
  .rollup { border-top: 1px solid var(--border); }
  .rollup:first-child { border-top: none; }
  .rollup-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 13px; cursor: pointer; }
  .rollup-h:hover { background: #f2f1ec; }
  :root[data-theme="dark"] .rollup-h:hover { background: #292d30; }
  .rollup-h .cnt { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .rollup-h .caret { color: var(--muted); display: inline-block; transition: transform .12s; }
  .rollup.open .rollup-h .caret { transform: rotate(90deg); }
  .rollup-body { display: none; }
  .rollup.open .rollup-body { display: block; }
  .notbuilt { background: color-mix(in oklab, var(--muted) 7%, var(--card)); border: 1px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .notbuilt b { color: var(--text); }

  /* ── Agent build panel (writes a parser, then must pass its own test) ── */
  .build { border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; overflow: hidden; }
  .build-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: color-mix(in oklab, var(--muted) 6%, var(--card)); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .build-h[onclick] { cursor: pointer; }
  .build-h[onclick]:hover { background: color-mix(in oklab, var(--muted) 12%, var(--card)); }
  .build-h .caret { color: var(--muted); font-size: 16px; display: inline-block; transition: transform .12s; }
  .build-h .caret.open { transform: rotate(90deg); }
  /* Collapsed: a quiet one-liner, no body, no border to divide. */
  .build.collapsed { background: transparent; }
  .build.collapsed .build-h { background: transparent; border-bottom: none; color: var(--muted); font-weight: 500; }
  .build.collapsed .build-h:hover { color: var(--text); }
  .build-h .spin { width: 12px; height: 12px; border-radius: 999px; border: 2px solid color-mix(in oklab, var(--accent) 35%, transparent); border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .build-h .spin { animation: none; } }
  .build-b { padding: 14px; }
  .verdict { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
  .verdict.pass { color: var(--success); background: color-mix(in oklab, var(--success) 14%, transparent); }
  .verdict.fail { color: var(--danger); background: color-mix(in oklab, var(--danger) 14%, transparent); }
  .stream { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.6; background: color-mix(in oklab, var(--muted) 8%, var(--card)); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  .stream .last { color: var(--text); }
  .build-b .label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .build-b .label:first-child { margin-top: 0; }
  .build-b textarea { width: 100%; font: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); resize: vertical; min-height: 62px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  :root[data-theme="dark"] .btn.primary { color: #12160f; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="mark">K</span><b>K-Realty</b></div>
    <div class="pillars">
      <button id="nav-ingest" onclick="show('ingest')"><span class="step">1</span>Ingest</button>
      <button id="nav-process" onclick="show('process')"><span class="step">2</span>Process</button>
      <button id="nav-reporting" onclick="show('reporting')"><span class="step">3</span>Report</button>
    </div>
    <div class="right">
      <span class="chip" id="llm">LLM …</span>
      <span class="chip" id="pending" style="display:none"></span>
      <button class="icon-btn" id="nav-settings" onclick="show('settings')" aria-label="Settings" title="Settings">&#9881;</button>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Enable dark mode" title="Enable dark mode"><span id="theme-icon" aria-hidden="true">&#9790;</span></button>
    </div>
  </div>
  <div class="pagehead" id="pagehead"><h1>Overview</h1></div>

  <div class="panel view" id="panel"></div>

  <div id="toast"></div>
</div>

<script>
  // ── the ONLY transport-specific code. Standalone: POST to the REST server.
  // In a Claude Live Artifact this one function becomes window.claude.callMcpTool.
  async function callTool(name, args = {}) {
    const res = await fetch('/api/tool/' + name, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = data && Object.prototype.hasOwnProperty.call(data, 'detail') ? data.detail : null;
      const msg = (detail && detail.message) ? detail.message : (detail || (name + ' failed'));
      const err = new Error(msg);
      err.detail = detail;
      throw err;
    }
    return data;
  }

  const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const el = id => document.getElementById(id);
  let current = 'reporting';
  const THEME_KEY = 'krealty-theme';
  const actionStepHistory = {};
  const actionRunState = {};

  // Ingest accordion state: which source is expanded, per-source validation
  // controls (group/search), and a cache of each source's transactions.
  const ingestOpen = { key: null };
  const sourceView = {};      // source_key -> { group, query }
  const sourceTxnCache = {};  // source_key -> source_transactions() result
  const sourceSettingsCache = {};  // source_key -> source_settings() result
  const svState = k => sourceView[k] || (sourceView[k] = { group: 'None', query: '' });

  function llmHost(baseUrl) {
    if (!baseUrl) return 'not set';
    try {
      const normalized = baseUrl.includes('://') ? baseUrl : ('http://' + baseUrl);
      let host = new URL(normalized).hostname || '';
      if (host.endsWith('.local')) host = host.slice(0, -6);
      return host || 'not set';
    } catch {
      // Best-effort parsing for non-URL strings.
      let host = String(baseUrl).replace(/^https?:\/\//i, '').split('/')[0].split('?')[0].split('#')[0];
      if (host.startsWith('[') && host.includes(']')) host = host.slice(1, host.indexOf(']'));
      else host = host.split(':')[0];
      if (host.endsWith('.local')) host = host.slice(0, -6);
      return host || 'not set';
    }
  }

  function toast(msg, ok) { const t = el('toast'); t.textContent = msg; t.style.display = ''; t.className = ok ? 'ok' : 'err'; }
  function clearToast() { const t = el('toast'); t.className = ''; t.style.display = 'none'; }
  function sourceDomId(sourceKey) { return String(sourceKey || '').replace(/[^a-zA-Z0-9_-]/g, '_'); }
  function setSourceButtonsDisabled(disabled) { document.querySelectorAll('.accbody button, .src button').forEach(b => b.disabled = disabled); }

  function defaultUploadSteps(fileName) {
    return [
      { key: 'selected_file', label: 'File selected' + (fileName ? ': ' + fileName : ''), status: 'success' },
      { key: 'upload_to_server', label: 'Upload to server (0%)', status: 'pending' },
      { key: 'save_temp_file', label: 'Save temp file', status: 'pending' },
      { key: 'ingest_document', label: 'Parse and persist', status: 'pending' },
      { key: 'cleanup_temp_file', label: 'Cleanup temp file', status: 'pending' },
      { key: 'done', label: 'Complete', status: 'pending' },
    ];
  }

  function renderUploadSteps(sourceKey, steps) {
    const host = el('upload-steps-' + sourceDomId(sourceKey));
    const row = el('upload-steps-row-' + sourceDomId(sourceKey));
    if (!host || !row) return;
    row.style.display = 'block';

    let html = '';
    steps.forEach((step, idx) => {
      const cls = step.status || 'pending';
      const title = step.error ? (' title="' + String(step.error).replace(/"/g, '&quot;') + '"') : '';
      html += '<span class="upload-step ' + cls + '"' + title + '>' + (step.label || step.key) + '</span>';
      if (idx < steps.length - 1) html += '<span class="upload-step-sep">&gt;</span>';
    });
    host.innerHTML = html;
    actionStepHistory[sourceKey] = steps.map(s => ({ ...s }));
  }

  function startActionRun(sourceKey, tool) {
    const runId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    actionRunState[sourceKey] = { runId, tool };
    return runId;
  }

  function isCurrentActionRun(sourceKey, runId) {
    const state = actionRunState[sourceKey];
    return !!state && state.runId === runId;
  }

  function defaultActionSteps(tool) {
    if (tool === 'run_scraper') {
      return [
        { key: 'run_scraper', label: 'Run scraper', status: 'pending' },
        { key: 'persist_scraped', label: 'Persist scraped transactions', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'fetch_source') {
      return [
        { key: 'fetch_and_ingest', label: 'Fetch and ingest', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'extract_now' || tool === 'ingest_document') {
      return [
        { key: 'extract', label: 'Read the document with the model', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'activate_parser') {
      return [
        { key: 'activate_parser', label: 'Activate parser', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    if (tool === 'start_login_recovery') {
      return [
        { key: 'launch_browser', label: 'Launch recovery browser', status: 'pending' },
        { key: 'user_login', label: 'Log in, then CLOSE the browser window to save the session', status: 'pending' },
        { key: 'session_saved', label: 'Session saved', status: 'pending' },
        { key: 'done', label: 'Complete', status: 'pending' },
      ];
    }
    return [
      { key: 'execute', label: 'Execute', status: 'pending' },
      { key: 'done', label: 'Complete', status: 'pending' },
    ];
  }

  function updateUploadStep(steps, key, status, label, error) {
    const next = steps.map(s => ({ ...s }));
    const idx = next.findIndex(s => s.key === key);
    if (idx >= 0) {
      next[idx].status = status || next[idx].status;
      if (label) next[idx].label = label;
      if (error) next[idx].error = error;
    }
    return next;
  }

  function applyServerUploadSteps(steps, serverSteps) {
    let next = steps.map(s => ({ ...s }));
    for (const serverStep of (serverSteps || [])) {
      const existing = next.find(s => s.key === serverStep.key);
      if (existing) {
        next = updateUploadStep(next, serverStep.key, serverStep.status, serverStep.label, serverStep.error);
      } else {
        const doneIdx = next.findIndex(s => s.key === 'done');
        const inserted = {
          key: serverStep.key,
          label: serverStep.label || serverStep.key,
          status: serverStep.status || 'pending',
          error: serverStep.error,
        };
        if (doneIdx >= 0) next.splice(doneIdx, 0, inserted);
        else next.push(inserted);
      }
    }
    return next;
  }

  function setTheme(theme) {
    const root = document.documentElement;
    root.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
    const next = theme === 'dark' ? 'light' : 'dark';
    el('theme-icon').innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
    el('theme-toggle').setAttribute('aria-label', 'Enable ' + next + ' mode');
    el('theme-toggle').setAttribute('title', 'Enable ' + next + ' mode');
  }

  function initialTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
  }

  // Which model, and WHERE its server is — the consent wording for sending a
  // document's text depends on the answer, so it can't be assumed.
  let llmInfo = null;

  async function loadStatus() {
    try {
      const s = await callTool('status');
      llmInfo = s.llm;
      el('llm').textContent = 'LLM: ' + llmHost(s.llm.base_url) + (s.llm.model ? ' · ' + s.llm.model : '');
      const p = s.pending_approvals || [];
      const pe = el('pending');
      if (p.length) { pe.style.display = ''; pe.className = 'chip warn'; pe.textContent = p.length + ' approval' + (p.length > 1 ? 's' : '') + ' needed'; }
      else { pe.style.display = 'none'; }
    } catch (e) { el('llm').textContent = 'LLM: unavailable'; }
  }

  function renderReporting() {
    el('panel').innerHTML = '<div class="empty">Reporting — cross-source summaries, P&amp;L, and Schedule&nbsp;E — isn’t built yet. ' +
      'It’s the third pillar, after ingested data has been processed. For now, validate each source’s data under <b>Ingest</b>.</div>';
  }

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  async function renderIngest() {
    el('panel').innerHTML = '<div class="empty">Loading sources…</div>';
    const [sourcesRes, pendingRes] = await Promise.allSettled([
      callTool('list_sources'),
      callTool('pending_approvals')
    ]);

    if (sourcesRes.status !== 'fulfilled') {
      const msg = (sourcesRes.reason && sourcesRes.reason.message) ? sourcesRes.reason.message : 'unknown error';
      el('panel').innerHTML = '<div class="empty">Could not load sources: ' + msg + '</div>';
      toast('Failed to load sources: ' + msg, false);
      return;
    }

    const sources = sourcesRes.value || [];
    // The ways a source can arrive are declared by the harness, not listed twice.
    if (!methodsCache) {
      try { methodsCache = await callTool('source_methods'); } catch (e) { methodsCache = []; }
    }
    const pending = pendingRes.status === 'fulfilled' ? (pendingRes.value || []) : [];
    if (pendingRes.status !== 'fulfilled') {
      const pendingErr = (pendingRes.reason && pendingRes.reason.message) ? pendingRes.reason.message : 'unknown error';
      toast('Loaded sources, but pending approvals failed: ' + pendingErr, false);
    }
    const pendingKeys = new Set(pending.map(p => p.key));

    if (!sources.length) { el('panel').innerHTML = '<div class="empty">No sources.</div>'; return; }

    // Load transactions for the open source before rendering its body.
    const openKey = ingestOpen.key;
    if (openKey && sources.some(s => s.key === openKey) && !sourceTxnCache[openKey]) {
      try { sourceTxnCache[openKey] = await callTool('source_transactions', { source_key: openKey }); }
      catch (e) { sourceTxnCache[openKey] = { error: e.message, transactions: [], count: 0, money_in: 0, money_out: 0 }; }
    }
    if (openKey && sources.some(s => s.key === openKey) && !sourceSettingsCache[openKey]) {
      // Best-effort: a source with no declared options simply has no panel.
      try { sourceSettingsCache[openKey] = await callTool('source_settings', { source_key: openKey }); }
      catch (e) { sourceSettingsCache[openKey] = { schema: [], values: {}, overridden: [] }; }
    }

    let html = '<div class="acc">';
    for (const s of sources) {
      const isOpen = s.key === openKey;
      const isPending = pendingKeys.has(s.key);
      const dotClass = s.status === 'implemented' ? 'ready' : (s.is_trigger ? 'trig' : '');
      const tags = (s.has_scraper ? '<span class="tag">scraper</span>' : '') +
        (s.parser_built ? '<span class="tag">parser</span>' : '') +
        (isPending ? '<span class="tag">needs approval</span>' : '');
      const data = isOpen ? sourceTxnCache[s.key] : null;
      const rt = (data && data.count)
        ? '<div class="rt"><div class="net ' + (netOf(data) < 0 ? 'neg' : 'pos') + '">' + money(netOf(data)) + '</div><div class="netlbl">net · ' + data.count + ' rows</div></div>'
        : '';
      html += '<div class="accitem' + (isOpen ? ' open' : '') + '">' +
        '<div class="acchead" onclick="toggleSource(\'' + s.key + '\')">' +
          '<span class="sdot ' + dotClass + '"></span>' +
          '<div class="info"><div class="nm">' + esc(s.label) + tags + '</div>' +
            '<div class="meta">' + esc(s.status) + ' · ' + esc(s.input_type || '') + '</div></div>' +
          rt + '<span class="caret">&#8250;</span></div>' +
        (isOpen ? '<div class="accbody">' + sourceBodyHTML(s, isPending) + '</div>' : '') +
      '</div>';
    }
    html += '</div>';
    html += addSourceHTML(sources);
    el('panel').innerHTML = html;

    // Rehydrate the open source's action step timeline + wire its file input.
    if (openKey) {
      const prior = actionStepHistory[openKey];
      if (prior && prior.length) renderUploadSteps(openKey, prior);
    }
  }

  // ── Add a data source ──────────────────────────────────────────────────────
  // Three steps: how it arrives › let it learn the source › check it and name it.
  //
  // Two rules the design turns on, and neither is negotiable in here:
  //   · the AGENT names it. The name field only appears in step 3, pre-filled
  //     from what it actually read — never a blank box before anything is known.
  //   · a website is CAPTURED, not described. There is no URL field anywhere;
  //     the demonstration records where the operator went.
  //
  // Step 1 has no Next button: the box IS the button. A radio plus a Next is two
  // clicks to say one thing, and there is nothing on that step to review first.
  let methodsCache = null;
  const STAGING = '_new';     // where a source is learned before it has a name
  const wiz = { open: false, step: 1, method: null, learning: false, preview: null,
                label: '', fork: 'new', busy: false, error: '', carrier: null,
                inbox: { from: '', subject: '', suffix: '.pdf', days: '' } };

  function openWizard() { wiz.open = true; renderIngest(); }

  function closeWizard() {
    Object.assign(wiz, { open: false, step: 1, method: null, learning: false, preview: null,
                         label: '', fork: 'new', busy: false, error: '', carrier: null,
                         inbox: { from: '', subject: '', suffix: '.pdf', days: '' } });
    renderIngest();
  }

  function wizBack() {
    if (wiz.step === 3) { wiz.step = 2; wiz.preview = null; wiz.error = ''; }
    else { wiz.step = 1; wiz.method = null; wiz.error = ''; }
    renderIngest();
  }

  /** Clicking the box commits to that route and moves on — no second click. */
  function chooseMethod(id) {
    wiz.method = id; wiz.step = 2; wiz.preview = null; wiz.error = '';
    renderIngest();
  }

  function wizMethod() { return (methodsCache || []).find(m => m.id === wiz.method); }

  function addSourceHTML(sources) {
    if (!wiz.open) {
      return '<div class="row" style="margin-top:18px">' +
        '<button class="btn" onclick="openWizard()">+ Add a data source</button></div>';
    }
    const body = wiz.step === 1 ? wizStep1()
               : wiz.step === 2 ? wizStep2()
               : wizStep3(sources);
    return '<div class="build" style="margin-top:18px"><div class="build-h">' +
      '<span class="caret open">&#8250;</span>Add a data source' +
      '<button class="btn" style="margin-left:auto;font-size:12px;padding:4px 9px" ' +
      'onclick="closeWizard()">Cancel</button></div>' +
      '<div class="build-b">' + wizSteps() + body + '</div></div>';
  }

  function wizSteps() {
    const labels = [[1, 'How it arrives'], [2, 'Let it learn the source'], [3, 'Check it and name it']];
    return '<div class="wsteps">' + labels.map(([n, t], i) =>
      '<span class="wstep' + (wiz.step === n ? ' on' : (wiz.step > n ? ' done' : '')) + '">' +
      '<span class="n">' + (wiz.step > n ? '&#10003;' : n) + '</span>' + esc(t) + '</span>' +
      (i < 2 ? '<span class="warrow">&#8250;</span>' : '')).join('') + '</div>';
  }

  /** Step 1 — the three doors. Each says what it will cost you every month,
   *  which is the actual difference between them. */
  function wizStep1() {
    const methods = methodsCache || [];
    if (!methods.length) return '<div class="empty">Couldn’t load the ways in.</div>';
    return methods.map(m =>
      '<div class="wopt" onclick="chooseMethod(\'' + m.id + '\')">' +
        '<span class="wico">' + esc(m.icon) + '</span>' +
        '<span><div class="t">' + esc(m.label) + '</div><div class="d">' + esc(m.detail) + '</div></span>' +
        '<span class="w">' + esc(m.cost) + ' &#8250;</span></div>').join('');
  }

  /** Step 2 — hand it the source and let it look. Nothing is named yet. */
  function wizStep2() {
    const m = wizMethod();
    if (!m) return '';
    const err = wiz.error ? '<div class="verdict fail">' + esc(wiz.error) + '</div>' : '';

    if (wiz.learning) {
      return '<div class="doing"><span class="spin"></span>' + esc(m.doing) + '</div>' +
        (wiz.method === 'website'
          ? '<p class="sub" style="margin:10px 0 0">Closing the window is how you say you’re done — ' +
            'and it keeps whatever you actually visited, so there’s no address to type.</p>' : '');
    }

    if (wiz.method === 'email') return err + wizEmailStep(m);

    return err + '<p class="note" style="margin:0 0 4px">' + esc(m.doing) + '</p>' +
      (wiz.method === 'website'
        ? '<p class="sub" style="margin:0 0 12px">No address to type: it records where you go.</p>'
        : '<p class="sub" style="margin:0 0 12px">It works out the format itself — you don’t have to say.</p>') +
      '<input id="wiz-sample" type="file" style="display:none" accept=".pdf,.csv,text/csv,application/pdf" ' +
        'onchange="handleWizardSample(event)">' +
      '<div class="row"><button class="btn" onclick="wizBack()">Back</button>' +
      '<button class="btn primary" onclick="' +
        (wiz.method === 'website' ? 'startWizardDemo()' : 'chooseWizardSample()') + '">' +
        esc(m.act) + '</button></div>';
  }

  /** An inbox signs in with Google, and that lives in Settings — the same inbox
   *  can feed several sources, so it isn't owned by this flow. Here we only
   *  search one that's already connected, and read what it carries. */
  function wizEmailStep(m) {
    const inboxes = (credCache || []).filter(c => c.kind === 'inbox');
    const connected = inboxes.filter(c => (emailCache[c.key] || {}).connected);
    const caveat = m.caveat
      ? '<div class="recovery-why" style="margin-bottom:12px"><b>Worth knowing.</b> ' + esc(m.caveat) + '</div>' : '';

    if (!connected.length) {
      return caveat + '<p class="note" style="margin:0 0 12px">No inbox is signed in yet. An inbox signs in ' +
        'with Google rather than a password, and that lives in <b>Settings</b> — the same inbox can feed ' +
        'more than one source, so it isn’t owned by this flow.</p>' +
        '<div class="row"><button class="btn" onclick="wizBack()">Back</button>' +
        '<button class="btn primary" onclick="closeWizard();show(\'settings\')">Open Settings</button></div>';
    }

    const chosen = wiz.carrier || connected[0].key;
    return caveat +
      '<div class="field"><label for="wiz-inbox">Which inbox</label>' +
      '<select id="wiz-inbox" onchange="wiz.carrier=this.value">' +
      connected.map(c => '<option value="' + esc(c.key) + '"' + (c.key === chosen ? ' selected' : '') + '>' +
        esc((emailCache[c.key] || {}).account_email || c.label) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="wiz-from">From address <span class="sub">(optional)</span></label>' +
      '<input type="text" id="wiz-from" value="' + esc(wiz.inbox.from) + '" placeholder="statements@example.com"></div>' +
      '<div class="field"><label for="wiz-subj">Subject contains <span class="sub">(optional)</span></label>' +
      '<input type="text" id="wiz-subj" value="' + esc(wiz.inbox.subject) + '" placeholder="Statement"></div>' +
      '<div class="field"><label for="wiz-suffix">Attachment ends with</label>' +
      '<input type="text" id="wiz-suffix" value="' + esc(wiz.inbox.suffix) + '"></div>' +
      '<div class="row"><button class="btn" onclick="wizBack()">Back</button>' +
      '<button class="btn primary" onclick="lookInInbox()">Look in that inbox</button></div>';
  }

  /** Step 3 — what it found, then (and only then) what to call it. */
  function wizStep3(sources) {
    const p = wiz.preview || {};
    const targets = sources.filter(s => !s.is_trigger);
    const trouble = p.trouble
      ? '<div class="recovery-why" style="margin-top:10px">' + esc(p.trouble) + '</div>' : '';

    const cols = (p.columns || []).length
      ? (p.columns || []).map(c => '<span class="tag">' + esc(c) + '</span>').join(' ')
      : '<span style="color:var(--faint)">none read yet</span>';

    const found = '<div class="lbl">What it found</div>' +
      '<div class="wfound">' +
      wfLine('Where it came from', esc(p.where || '—')) +
      wfLine('How it gets it', '<span style="color:var(--muted)">' + esc(p.how || '—') + '</span>') +
      // A document's row count is the model's estimate from one look, not a
      // parse — say so, rather than let it read as a counted fact.
      wfLine('What it read', (p.rows_estimated ? 'about ' : '') + (p.rows || 0) + ' rows' +
        (p.span ? ' · ' + esc(p.span) : '') +
        (p.rows_estimated ? '<div class="sub">from one quick look — the parser counts them properly</div>' : '')) +
      wfLine('Its columns', cols) +
      wfLine('Afterwards', '<span style="color:var(--muted)">' +
        (p.unattended ? 'can run unattended' : 'needs you to hand it each file') + '</span>') +
      '</div>' + trouble;

    const nameHint = p.name_source === 'model'
      ? 'Suggested from what it just read — change it to whatever you call it.'
      : 'Suggested from the file name — change it to whatever you call it.';
    const nameField = '<div class="field" style="margin-top:14px"><label for="wiz-label">Call it</label>' +
      '<input type="text" id="wiz-label" value="' + esc(wiz.label) + '" autocomplete="off" ' +
      'oninput="wiz.label=this.value"><span class="sub">' + nameHint + '</span></div>';

    // The question that stops a second door being modelled as a second source.
    const fork = '<div class="lbl">Is this new, or another way into something you have?</div>' +
      forkOptHTML('new', 'A new source', 'Nothing here covers this data yet.') +
      targets.map(t => forkOptHTML(t.key, 'Another way into ' + t.label,
        (t.transports || []).filter(r => r.available).map(r => r.label.toLowerCase()).join(', ') ||
        'no working route yet')).join('');

    const isNew = wiz.fork === 'new';
    const err = wiz.error ? '<div class="verdict fail">' + esc(wiz.error) + '</div>' : '';
    return err + found + (isNew ? nameField : '') + fork +
      '<div class="row"><button class="btn" onclick="wizBack()">Back</button>' +
      '<button class="btn primary"' + (wiz.busy ? ' disabled' : '') + ' onclick="saveWizard()">' +
      (wiz.busy ? 'Saving…' : (isNew ? 'Save this source' : 'Add this route')) + '</button></div>';
  }

  function wfLine(k, v) {
    return '<div class="wfline"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>';
  }

  function forkOptHTML(key, title, detail) {
    return '<div class="wopt' + (wiz.fork === key ? ' on' : '') + '" onclick="wiz.fork=\'' + key + '\';renderIngest()">' +
      '<span class="wradio"></span><span><div class="t">' + esc(title) + '</div>' +
      '<div class="d">' + esc(detail) + '</div></span></div>';
  }

  /* ── step 2 actions: hand it the source, let it look ── */

  function chooseWizardSample() { const i = el('wiz-sample'); if (i) i.click(); }

  async function handleWizardSample(event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    wiz.learning = true; wiz.error = ''; clearToast();
    await renderIngest();
    const form = new FormData();
    form.append('file', file);
    try {
      // Staged under a placeholder key: the source has no name yet — working out
      // what to call it is the point of reading the document.
      const res = await fetch('/api/upload_sample/' + STAGING, { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.detail && data.detail.message) || data.detail || 'upload failed');
      wiz.preview = await callTool('preview_document', { sample_path: data.sample_path, filename: file.name });
      wiz.label = wiz.preview.suggested_name || '';
      wiz.step = 3;
    } catch (e) {
      wiz.error = 'Couldn’t read that document: ' + e.message;
    } finally {
      wiz.learning = false;
      if (input) input.value = '';
      await renderIngest();
    }
  }

  async function startWizardDemo() {
    wiz.learning = true; wiz.error = ''; clearToast();
    await renderIngest();
    try {
      await callTool('start_demo', { source_key: STAGING });
      pollWizardDemo();
    } catch (e) {
      wiz.learning = false; wiz.error = 'Couldn’t open the browser: ' + e.message;
      await renderIngest();
    }
  }

  function pollWizardDemo() {
    const tick = async () => {
      let d;
      try { d = await callTool('demo_status', { source_key: STAGING }); }
      catch (e) { wiz.learning = false; wiz.error = 'Lost contact with the demonstration: ' + e.message; await renderIngest(); return; }
      if (d.status === 'running') { setTimeout(tick, 2000); return; }
      if (d.status !== 'completed') {
        wiz.learning = false; wiz.error = d.message || 'The demonstration wasn’t captured.';
        await renderIngest();
        return;
      }
      try {
        wiz.preview = await callTool('preview_demo', { demo_path: d.demo_path });
        wiz.label = wiz.preview.suggested_name || '';
        wiz.step = 3;
      } catch (e) {
        wiz.error = 'Captured it, but couldn’t read it back: ' + e.message;
      }
      wiz.learning = false;
      await renderIngest();
    };
    setTimeout(tick, 2000);
  }

  async function lookInInbox() {
    const sel = el('wiz-inbox');
    wiz.carrier = sel ? sel.value : wiz.carrier;
    wiz.inbox = {
      from: el('wiz-from').value, subject: el('wiz-subj').value,
      suffix: el('wiz-suffix').value, days: '',
    };
    wiz.learning = true; wiz.error = ''; clearToast();
    await renderIngest();
    try {
      wiz.preview = await callTool('preview_inbox', {
        carrier_key: wiz.carrier, from_address: wiz.inbox.from,
        subject_contains: wiz.inbox.subject, attachment_suffix: wiz.inbox.suffix,
      });
      wiz.label = wiz.preview.suggested_name || '';
      wiz.step = 3;
    } catch (e) {
      wiz.error = 'Couldn’t search that inbox: ' + e.message;
    } finally {
      wiz.learning = false;
      await renderIngest();
    }
  }

  /* ── step 3 action: save ── */

  async function saveWizard() {
    const labelEl = el('wiz-label');
    if (labelEl) wiz.label = labelEl.value;
    wiz.busy = true; wiz.error = ''; clearToast();
    await renderIngest();

    const p = wiz.preview || {};
    try {
      // "Another way into X" adds a route to a source that already exists —
      // it must NOT create a second source for the same body of data.
      const key = wiz.fork === 'new'
        ? (await callTool('add_source', {
            label: wiz.label, method: wiz.method, adopt_staged: true,
            login_url: wiz.method === 'website' ? (p.where || '') : '',
            delivers_to: '',
          })).source_key
        : wiz.fork;

      if (wiz.method === 'email') {
        // The inbox is the carrier; what it delivers to is what the fork chose.
        await callTool('save_email_fetch', {
          source_key: wiz.carrier,
          delivers_to: wiz.fork === 'new' ? key : wiz.fork,
          from_address: wiz.inbox.from, subject_contains: wiz.inbox.subject,
          attachment_suffix: wiz.inbox.suffix,
        });
      }

      // Hand what it learned to that source's own panel, which is where code
      // gets built for every source — there is no second build flow in here.
      const st = bs(key);
      if (p.demo_path) demoState[key] = { status: 'completed', demo_path: p.demo_path,
                                          login_url: p.where, captured_requests: p.requests,
                                          recorded_actions: p.actions };
      if (p.sample_path) st.sample = { sample_path: p.sample_path, filename: p.where, bytes: 0 };
      st.expanded = true;

      // Read these BEFORE closing — closeWizard resets the state they live in.
      const label = wiz.label, wasNew = wiz.fork === 'new';
      closeWizard();
      ingestOpen.key = key;
      delete sourceTxnCache[key];
      await renderIngest();
      toast(wasNew ? ('Added ' + label + '. Next: it writes the code, and you approve it.')
                   : 'Added another way into ' + key + '.', true);
    } catch (e) {
      wiz.busy = false; wiz.error = e.message;
      await renderIngest();
    }
  }
  function netOf(data) { return (data.money_in || 0) + (data.money_out || 0); }

  function toggleSource(key) {
    ingestOpen.key = (ingestOpen.key === key) ? null : key;
    renderIngest();
  }

  const ROUTE_ICON = { email: '✉', scrape: '↻', upload: '⬆' };

  /** One source, several ways in. The picture IS the model: doors on the left,
   *  one body of data on the right. ★ is the default — what "Get latest" runs. */
  function funnelHTML(s) {
    const routes = s.transports || [];
    if (!routes.length) return '';
    const n = routes.length;
    const h = Math.max(78, n * 44), mid = h / 2, top = 14, bot = h - 14;
    // Solid = the route the data on screen ACTUALLY came by; dashed = available
    // but not used. So the drawing is history, not configuration — the ★ carries
    // the config meaning. Falls back to the default before anything has run.
    const data = sourceTxnCache[s.key];
    const live = (data && data.last_transport) || s.default_transport;
    const liveIndex = routes.findIndex(r => r.id === live);
    const dash = i => (i === liveIndex ? '' : ' stroke-dasharray="3 3"');

    let paths = '<path d="M2 ' + mid + ' H56" stroke="currentColor" stroke-width="1.5" fill="none"' + dash(0) + '/>';
    if (n > 1) {
      const ys = routes.map((_, i) => n === 1 ? mid : top + (bot - top) * (i / (n - 1)));
      paths = ys.map((y, i) =>
        (Math.abs(y - mid) < 1
          ? '<path d="M2 ' + y + ' H56"'
          : '<path d="M2 ' + y + ' C36 ' + y + ', 26 ' + mid + ', 56 ' + mid + '"') +
        ' stroke="currentColor" stroke-width="1.5" fill="none"' + dash(i) + '/>').join('');
    }

    const doors = routes.map(r => {
      const isDefault = r.id === s.default_transport;
      // Two separate targets on purpose: the star sets the default, the rest of
      // the box RUNS the route. One control doing both was the confusion.
      const star = isDefault
        ? '<span class="star" title="this is the default">★</span>'
        : (r.available
            ? '<span class="star set" title="make this the default" ' +
              'onclick="event.stopPropagation();pinDefault(\'' + s.key + '\',\'' + r.id + '\')">☆</span>'
            : '<span class="star"></span>');
      const right = r.available
        ? (r.id === live ? 'last used' : (r.unattended ? 'can run unattended' : 'needs you'))
        : esc(r.reason || 'not available');
      const runnable = r.available;
      return '<div class="door' + (isDefault ? ' on' : '') + (runnable ? ' go' : ' off') +
        (r.id === live ? ' live' : '') + '"' +
        (runnable ? ' onclick="runRoute(\'' + s.key + '\',\'' + r.id + '\')"' +
                    ' title="run this now — ' + esc(r.detail) + '"'
                  : ' title="' + esc(r.reason || r.detail) + '"') + '>' +
        star + '<span>' + (ROUTE_ICON[r.id] || '•') + '</span>' +
        '<span class="t">' + esc(r.label) + '</span>' +
        '<span class="w">' + right + '</span></div>';
    }).join('');

    const count = data && data.count ? data.count : 0;
    return '<div class="funnel"><div class="doors">' + doors + '</div>' +
      '<div class="pipe"><svg viewBox="0 0 58 ' + h + '" style="height:' + h + 'px;width:58px" aria-hidden="true">' +
      paths + '<circle cx="56" cy="' + mid + '" r="3" fill="currentColor"/></svg></div>' +
      '<div class="catch"><div class="big">' + count + '</div>' +
      '<div class="cap">transactions</div>' +
      '<div class="cap" style="opacity:.75">however they arrived</div></div></div>';
  }

  // ── Per-source options, rendered from what the SOURCE declares ──
  // Nothing here names a portal's fields; the schema arrives from the source's
  // own module, so a new source with different knobs needs no UI change.
  const optsOpen = {};

  function optionsHTML(s) {
    const cfg = sourceSettingsCache[s.key];
    if (!cfg || !cfg.schema || !cfg.schema.length) return '';   // nothing to adjust
    const sid = sourceDomId(s.key);
    const changed = (cfg.overridden || []).length;
    const open = !!optsOpen[s.key];

    const head = '<div class="build-h" onclick="toggleOptions(\'' + s.key + '\')">' +
      '<span class="caret' + (open ? ' open' : '') + '">&#8250;</span>Options for this pull' +
      '<span class="hint" style="margin-left:auto;font-weight:400">' +
      (changed ? changed + ' changed from default' : 'using defaults') + '</span></div>';
    if (!open) return '<div class="build collapsed">' + head + '</div>';

    const fields = cfg.schema.map(f => {
      const v = cfg.values[f.key];
      const id = 'opt-' + sid + '-' + f.key;
      let input;
      if (f.type === 'boolean') {
        input = '<input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '>';
      } else if (f.type === 'choice') {
        input = '<select id="' + id + '">' + (f.options || []).map(o =>
          '<option value="' + esc(o.value) + '"' + (o.value === v ? ' selected' : '') + '>' +
          esc(o.label || o.value) + '</option>').join('') + '</select>';
      } else {
        const kind = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
        input = '<input type="' + kind + '" id="' + id + '" value="' + esc(v == null ? '' : v) + '"' +
          (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + '>';
      }
      return '<div class="field"><label for="' + id + '">' + esc(f.label || f.key) +
        ((cfg.overridden || []).includes(f.key) ? ' <span class="hint">· changed</span>' : '') +
        '</label>' + input +
        (f.help ? '<span class="sub">' + esc(f.help) + '</span>' : '') + '</div>';
    }).join('');

    return '<div class="build"><div class="build-b">' +
      '<p class="note" style="margin:0 0 12px">These are the choices the portal asks for before it ' +
      'hands over data. They apply to the next pull — no code change needed.</p>' + fields +
      '<div class="row"><button class="btn primary" onclick="saveOptions(\'' + s.key + '\')">Save options</button>' +
      (changed ? '<button class="btn" onclick="resetOptions(\'' + s.key + '\')">Back to defaults</button>' : '') +
      '</div></div></div>';
  }

  function toggleOptions(key) { optsOpen[key] = !optsOpen[key]; renderIngest(); }

  function readOptions(key) {
    const cfg = sourceSettingsCache[key];
    const sid = sourceDomId(key);
    const out = {};
    (cfg.schema || []).forEach(f => {
      const node = el('opt-' + sid + '-' + f.key);
      if (!node) return;
      out[f.key] = f.type === 'boolean' ? node.checked : node.value;
    });
    return out;
  }

  async function saveOptions(key) {
    clearToast();
    try {
      sourceSettingsCache[key] = await callTool('save_source_settings',
        { source_key: key, values: readOptions(key) });
      toast('Options saved — they apply to the next pull.', true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t save: ' + e.message, false);
    }
  }

  async function resetOptions(key) {
    clearToast();
    try {
      sourceSettingsCache[key] = await callTool('reset_source_settings', { source_key: key });
      toast('Back to the source’s own defaults.', true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t reset: ' + e.message, false);
    }
  }

  /** Click the box, run that route. Upload opens the picker; the rest just go. */
  function runRoute(key, transport) {
    if (transport === 'upload') return chooseUpload(key);
    if (transport === 'scrape') return act('run_scraper', { source_key: key });
    if (transport === 'email') return act('get_latest', { source_key: key });
    return act('get_latest', { source_key: key });
  }

  /** The month-to-month answer: does this source look after itself, or need you? */
  function verdictHTML(s, isPending) {
    const routes = s.transports || [];
    const def = routes.find(r => r.id === s.default_transport);
    let txt;
    if (!def) {
      txt = '<span class="verdict-txt manual">No working route yet — build a parser or a scraper below.</span>';
    } else if (s.can_automate) {
      txt = '<span class="verdict-txt self">★ Can run itself — ' + esc(def.label.toLowerCase()) + '</span>';
    } else {
      txt = '<span class="verdict-txt manual">Needs you — ' + esc(def.label.toLowerCase()) +
            ' can’t run unattended</span>';
    }

    // No "Get latest" button: clicking a door runs that route, so a separate
    // button would be a second control for the same act.
    let btns = '';
    if (isPending) {
      btns += '<button class="btn" onclick="act(\'activate_parser\',{source_key:\'' + s.key + '\'})">Approve the parser</button>';
    }
    // The file picker still has to exist in the DOM for the upload door to open.
    if (routes.some(r => r.id === 'upload' && r.available)) {
      btns += sourceUploadAction(s.key, false);
    }
    return '<div class="verdict-row">' + txt + btns + '</div>';
  }

  async function pinDefault(key, transport) {
    clearToast();
    try {
      const r = await callTool('set_default_transport', { source_key: key, transport });
      toast('Default is now ' + transport + (r.can_automate ? ' — this route can run unattended.' : '.'), true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t set the default: ' + e.message, false);
    }
  }

  // ── Reading a document with the model instead of a parser ──
  // Two ways to end up here: the source has no parser yet, or its parser choked
  // on this layout. Either way the harness isn't blocked — but the model is
  // unverified, so it's offered, never silently substituted.
  const llmOffer = {};   // source_key -> { mode:'extract'|'fallback', path, filename }

  function offerExtract(key, mode, path, filename) {
    llmOffer[key] = { mode, path, filename };
    renderIngest();
  }

  function dismissOffer(key) { delete llmOffer[key]; renderIngest(); }

  function offerHTML(s) {
    const offer = llmOffer[s.key];
    if (!offer) return '';
    const model = (llmInfo && llmInfo.model) ? llmInfo.model : 'the configured model';
    // Say where the text actually goes. Claiming "this leaves your machine" for
    // a model running on the LAN would be a lie, so the server computes it.
    const where = llmInfo && llmInfo.offsite === false
      ? 'Its text goes to <b>' + esc(llmInfo.destination || 'your model server') + '</b> — on your own network, ' +
        'not off this machine.'
      : 'Its text goes to <b>' + esc((llmInfo && llmInfo.destination) || 'the Anthropic API') + '</b>. ' +
        'This is the one step where a financial document leaves this machine.';
    const why = offer.mode === 'fallback'
      ? 'The built-in parser couldn’t read <b>' + esc(offer.filename || 'that document') + '</b>.'
      : 'This source has no parser yet.';

    return '<div class="build"><div class="build-h"><span class="caret open">&#8250;</span>' +
      'Read it with the model instead?</div><div class="build-b">' +
      '<p class="note" style="margin:0 0 10px">' + why + ' ' + model + ' can read it now and give you ' +
      'transactions today. ' + where + '</p>' +
      '<p class="note" style="margin:0 0 12px">The result is <b>unverified</b> — no test, no reproducible ' +
      'code — so treat it as lower-confidence than a parser’s, and have the agent build a parser so the ' +
      'next run doesn’t need this.</p>' +
      '<div class="row"><button class="btn primary" onclick="runExtract(\'' + s.key + '\')">' +
      'Send the text and extract</button>' +
      '<button class="btn" onclick="dismissOffer(\'' + s.key + '\')">No thanks</button></div>' +
      '</div></div>';
  }

  async function runExtract(key) {
    const offer = llmOffer[key];
    if (!offer) return;
    delete llmOffer[key];
    if (offer.mode === 'fallback') {
      await act('ingest_document', { source_key: key, path: offer.path, allow_llm_fallback: true });
    } else {
      await act('extract_now', { source_key: key, path: offer.path });
    }
  }

  function sourceBodyHTML(s, isPending) {
    const actions = funnelHTML(s) + verdictHTML(s, isPending) + sourceUploadStepsRow(s.key);
    // The build/fix panel sits directly under the action + step timeline, BEFORE
    // the data: when a run fails, "what to do next" belongs next to the failure,
    // not below a table the operator has to scroll past to find it.
    // Options sit between "how it arrives" and "fix the code": adjusting a date
    // range is the ordinary thing to do, rewriting the scraper is the rare one.
    // The model offer sits ahead of the build panel: "read it now" is the answer
    // when you need the numbers today; "build a parser" is the answer for every
    // month after that.
    const head = actions + offerHTML(s) + optionsHTML(s) + buildHTML(s);
    const data = sourceTxnCache[s.key];
    if (!data) return head + '<div class="empty">Loading transactions…</div>';
    if (data.error) return head + '<div class="notbuilt">Couldn’t load transactions: ' + esc(data.error) + '</div>';
    if (!data.transactions || !data.transactions.length) {
      // Carriers are no longer listed as sources, so the old "this is a delivery
      // trigger, not a ledger" apology has nothing left to explain.
      const msg = s.default_transport
        ? 'No transactions yet — use <b>Get latest</b> above to bring some in.'
        : 'No working route yet. Build a parser or a scraper below, then get the data.';
      return head + '<div class="notbuilt">' + msg + '</div>';
    }
    return head + '<div id="detail-' + sourceDomId(s.key) + '" class="__detail">' +
      validationHTML(s.key, data) + '</div>';
  }

  // ── Agent build: sample -> agent writes parser + test -> operator approves ──
  // Long-running, so start_build returns immediately and we tail build_status.
  const buildState = {};   // source_key -> { sample, events, status, result, passed, feedback, token }
  const bs = k => buildState[k] || (buildState[k] = { sample: null, events: [], status: 'idle', feedback: '' });

  /** A source that pulls from a portal is maintained as a SCRAPER; anything else
   *  is maintained as a parser. That's the code the operator would fix. */
  function buildKindFor(s) {
    // Before a scraper exists, only the source itself says it's a portal — so
    // a newly added website is offered a demonstration, not a sample document.
    return (s.has_scraper || s.input_type === 'html_scrape') ? 'scraper' : 'parser';
  }

  /** Did the last action on this source end in failure? */
  function lastActionFailed(key) {
    const steps = actionStepHistory[key];
    return !!(steps && steps.some(s => s.status === 'failed'));
  }

  /** Only take up room when there's a reason to: an actual failure, work in
   *  flight, a result to review, or a source with no code built yet (where
   *  building IS the main action). Otherwise collapse to its header. */
  function buildExpanded(s) {
    const st = bs(s.key);
    if (st.expanded !== undefined) return st.expanded;   // operator overrode it
    if (st.status && st.status !== 'idle') return true;
    if (lastActionFailed(s.key)) return true;
    return !s.has_scraper && !s.parser_built;
  }

  function toggleBuildPanel(key) {
    const st = bs(key);
    st.expanded = !st._expandedNow;   // flip whatever is on screen right now
    renderIngest();
  }

  function buildHTML(s) {
    if (s.is_trigger) return '';   // a trigger has no code of its own to build
    const st = bs(s.key);
    const sid = sourceDomId(s.key);
    const kind = buildKindFor(s);
    st.kind = kind;
    const expanded = buildExpanded(s);
    st._expandedNow = expanded;
    const title = kind === 'scraper'
      ? (s.has_scraper ? 'Fix this source’s scraper' : 'Teach the harness this website')
      : (s.parser_built ? 'Rebuild' : 'Build') + ' this source’s parser';

    if (!expanded) {
      // Collapsed: one quiet line, still one click away.
      return '<div class="build collapsed"><div class="build-h" onclick="toggleBuildPanel(\'' + s.key + '\')">' +
        '<span class="caret">&#8250;</span>' + title +
        '<span class="hint" style="margin-left:auto;font-weight:400">' +
        (kind === 'scraper' ? 'the agent can fix it' : 'the agent can rebuild it') + '</span>' +
        '</div></div>';
    }

    let inner;
    if (st.status === 'running') {
      const shown = st.events.slice(-40);
      inner = '<div class="stream" id="stream-' + sid + '">' +
        (shown.length ? shown.map((e, i) =>
          '<span class="' + (i === shown.length - 1 ? 'last' : '') + '">' + esc(e) + '</span>').join('\n')
          : 'Starting the agent…') + '</div>' +
        '<div class="row" style="margin-top:12px"><span class="hint">This takes a few minutes. ' +
        'You can leave this page open; progress keeps streaming.</span></div>';
    } else if (st.status === 'completed' || st.status === 'failed') {
      inner = buildResultHTML(s, st);
    } else if (kind === 'scraper' && !s.has_scraper) {
      inner = demonstrateHTML(s);
    } else if (kind === 'scraper') {
      // Revise needs no demonstration — the agent reads the harness's own
      // failure logs, so a broken scrape is fixable straight from here.
      inner =
        '<p class="note" style="margin:0 0 12px">When a scrape fails, the harness fixes its own code: ' +
        'its agent reads the failure logs, edits <code>core/scrapers/' + esc(s.key) + '.py</code>, updates the ' +
        'test, and the harness re-runs that test independently before anything is used.</p>' +
        '<div class="label">Anything to add? (optional — it reads the logs either way)</div>' +
        '<textarea id="feedback-' + sid + '" placeholder="e.g. the transactions POST returns 403">' +
          esc(st.feedback || '') + '</textarea>' +
        '<div class="row" style="margin-top:10px">' +
        '<button class="btn primary" onclick="reviseBuild(\'' + s.key + '\')">Have the agent fix the scraper</button>' +
        '</div>';
    } else {
      inner =
        '<p class="note" style="margin:0 0 12px">The harness writes the parser itself: give it one real ' +
        'sample document, and its own agent writes the code <b>and a test</b>, then re-runs that test ' +
        'independently. Nothing activates until you approve it.</p>' +
        (st.sample
          ? '<div class="kv">Sample: <b>' + esc(st.sample.filename) + '</b> (' + st.sample.bytes.toLocaleString() + ' bytes)</div>'
          : '') +
        '<div class="row">' +
        '<button class="btn" onclick="chooseSample(\'' + s.key + '\')">' +
          (st.sample ? 'Choose a different sample' : 'Choose a sample document') + '</button>' +
        '<input id="sample-input-' + sid + '" type="file" style="display:none" accept=".pdf,.csv,text/csv,application/pdf" ' +
          'onchange="handleSampleFile(\'' + s.key + '\', event)" />' +
        (st.sample
          ? '<button class="btn primary" onclick="startBuild(\'' + s.key + '\')">' +
            (s.parser_built ? 'Rebuild' : 'Build') + ' the parser</button>'
          : '') +
        // Building takes minutes; sometimes you just need this month's numbers.
        (st.sample && !s.parser_built
          ? '<button class="btn" onclick="offerExtract(\'' + s.key + '\',\'extract\',' +
            esc(JSON.stringify(st.sample.sample_path)) + ',' + esc(JSON.stringify(st.sample.filename)) + ')">' +
            'Read it now with the model</button>'
          : '') +
        '</div>';
    }

    const running = st.status === 'running';
    return '<div class="build"><div class="build-h"' +
      // Don't let it be collapsed mid-run — the stream is the only progress signal.
      (running ? '' : ' onclick="toggleBuildPanel(\'' + s.key + '\')"') + '>' +
      (running ? '<span class="spin"></span>' : '<span class="caret open">&#8250;</span>') +
      (running ? 'Agent is working on the ' + kind + '…' : title) +
      '</div><div class="build-b" id="build-' + sid + '">' + inner + '</div></div>';
  }

  // ── Demonstrating a portal ─────────────────────────────────────────────────
  // The scraper equivalent of "here's a sample document": the operator does it
  // once, by hand, and the harness records what happened for its agent to read.
  // Finishing is closing the window — there is no terminal to press Enter at.
  const demoState = {};   // source_key -> { status, message, demo_path, login_url, ... }

  function demonstrateHTML(s) {
    const d = demoState[s.key] || {};
    if (d.status === 'running') {
      return '<div class="stream">' + esc(d.message || 'A browser is open…') + '</div>' +
        '<p class="note" style="margin:12px 0 0">Sign in, choose the dates or filters you want, ' +
        'and click Generate/Search so <b>your</b> data is on screen. Then <b>close the browser ' +
        'window</b> — that’s how you tell the harness you’re done.</p>';
    }

    const failed = d.status === 'failed'
      ? '<div class="verdict fail">' + esc(d.message || 'The demonstration wasn’t captured') + '</div>' : '';

    if (d.status === 'completed') {
      return failed +
        '<div class="verdict pass">Demonstration captured — ' + (d.captured_requests || 0) +
        ' requests, ' + (d.recorded_actions || 0) + ' clicks</div>' +
        (d.login_url ? '<div class="kv">Signed in at <b>' + esc(d.login_url) + '</b> — saved, so the ' +
          'harness knows where to go next time.</div>' : '') +
        '<p class="note" style="margin:10px 0 12px">The agent will read that demonstration, write ' +
        '<code>core/scrapers/' + esc(s.key) + '.py</code> <b>and a test</b>, and the harness re-runs ' +
        'that test independently before anything is used.</p>' +
        '<div class="row"><button class="btn primary" onclick="startBuild(\'' + s.key + '\')">' +
        'Have the agent write the scraper</button>' +
        '<button class="btn" onclick="startDemo(\'' + s.key + '\')">Demonstrate again</button></div>';
    }

    return failed +
      '<p class="note" style="margin:0 0 12px">Show the harness how to get this data, once. ' +
      'A browser opens — sign in, set your filters, and click Generate/Search until your data is on ' +
      'screen, then close the window. The harness records the network traffic and your clicks, and ' +
      'its agent writes the scraper from that. No URL needed: it learns where you went.</p>' +
      '<div class="row"><button class="btn primary" onclick="startDemo(\'' + s.key + '\')">' +
      'Open a browser and show it</button></div>';
  }

  async function startDemo(key) {
    clearToast();
    try {
      await callTool('start_demo', { source_key: key });
      demoState[key] = { status: 'running', message: 'A browser is opening…' };
      await renderIngest();
      pollDemo(key);
    } catch (e) {
      demoState[key] = { status: 'failed', message: e.message };
      await renderIngest();
    }
  }

  function pollDemo(key) {
    const tick = async () => {
      let d;
      try { d = await callTool('demo_status', { source_key: key }); }
      catch (e) { demoState[key] = { status: 'failed', message: 'Lost contact with the demonstration: ' + e.message }; await renderIngest(); return; }
      if (d.status === 'running') {
        // Don't re-render while they're working in the browser.
        demoState[key] = d;
        setTimeout(tick, 2000);
        return;
      }
      demoState[key] = d;
      // The demo taught the harness the portal's URL, so the source changed.
      await renderIngest();
      toast(d.status === 'completed' ? d.message : ('Demonstration failed: ' + d.message),
            d.status === 'completed');
    };
    setTimeout(tick, 2000);
  }

  function buildResultHTML(s, st) {
    const sid = sourceDomId(s.key);
    const kind = st.kind || 'parser';
    if (st.status === 'failed') {
      return '<div class="verdict fail">The agent run failed</div>' +
        '<div class="label">What went wrong</div>' +
        '<div class="stream">' + esc(st.message || 'The run failed.') + '</div>' +
        '<div class="row" style="margin-top:12px">' +
        '<button class="btn" onclick="resetBuild(\'' + s.key + '\')">Start over</button>' +
        (kind === 'scraper' || st.sample
          ? '<button class="btn primary" onclick="' +
            (kind === 'scraper' ? 'reviseBuild' : 'startBuild') + '(\'' + s.key + '\')">Try again</button>'
          : '') +
        '</div>';
    }

    const r = st.result || {};
    const v = r.verification || {};
    const test = v.test || {};
    const txns = v.transactions || [];
    let verdict;
    if (!st.passed) {
      verdict = '<div class="verdict fail">Not usable yet — the test did not pass</div>';
    } else if (kind === 'scraper') {
      // A scraper self-registers; the proof is its test, and then a real run.
      verdict = '<div class="verdict pass">Test passed' +
        (v.registered ? ' — scraper registered' : '') + '</div>';
    } else {
      verdict = '<div class="verdict pass">Test passed — ' + txns.length + ' transactions parsed</div>';
    }

    let body = verdict;
    if (r.agent_summary) body += '<div class="label">What the agent did</div><div class="stream">' + esc(r.agent_summary) + '</div>';

    // The gate: the harness re-ran the agent's own test in a clean subprocess.
    body += '<div class="label">Independent test run' + (test.ok ? ' — passed' : ' — failed') + '</div>' +
      '<div class="stream">' + esc((test.output || v.error || '(no output)').slice(-3000)) + '</div>';
    if (v.untested_code && v.untested_code.length) {
      body += '<div class="label">Written without a test</div><div class="stream">' +
        esc(v.untested_code.join('\n')) + '</div>';
    }

    if (txns.length) {
      body += '<div class="label">Parsed from your sample — check these are right</div>' +
        txnTableHTML(txns.slice(0, 25).map(t => ({ amount: t.amount, fields: t.fields })));
    }
    if (kind === 'scraper' && st.passed) {
      body += '<div class="label">Next</div><p class="note" style="margin:0">A passing test means the code is ' +
        'sound, not that the portal accepted it. Run the scraper to confirm against the live site.</p>';
    }

    body += '<div class="label">Not right? Tell the agent what to change</div>' +
      '<textarea id="feedback-' + sid + '" placeholder="' +
        (kind === 'scraper' ? 'e.g. the transactions POST still returns 403'
                            : 'e.g. the Amount column is losing negatives on refunds') + '">' +
      esc(st.feedback || '') + '</textarea>' +
      '<div class="row" style="margin-top:10px">' +
      (st.passed
        ? (kind === 'scraper'
            // Scrapers self-register — there is no activation step to approve.
            ? '<button class="btn primary" onclick="runScraperAfterFix(\'' + s.key + '\')">Run the scraper now</button>'
            : '<button class="btn primary" onclick="approveBuild(\'' + s.key + '\')">Approve &amp; activate</button>')
        : '') +
      '<button class="btn" onclick="reviseBuild(\'' + s.key + '\')">' +
        (kind === 'scraper' ? 'Fix it again' : 'Revise with the agent') + '</button>' +
      '<button class="btn" onclick="resetBuild(\'' + s.key + '\')">Dismiss</button>' +
      '</div>';
    return body;
  }

  async function runScraperAfterFix(key) {
    resetBuild(key);
    await act('run_scraper', { source_key: key });
  }

  function chooseSample(key) { const i = el('sample-input-' + sourceDomId(key)); if (i) i.click(); }

  async function handleSampleFile(key, event) {
    const input = event && event.target;
    const file = input && input.files && input.files[0];
    if (!file) return;
    clearToast();
    toast('Saving ' + file.name + '…', true);
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/upload_sample/' + encodeURIComponent(key), { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.detail && data.detail.message) || data.detail || 'upload failed');
      bs(key).sample = data;
      toast('Sample saved. Ready to build.', true);
      await renderIngest();
    } catch (e) {
      toast('Couldn’t save the sample: ' + e.message, false);
    } finally {
      if (input) input.value = '';
    }
  }

  async function startBuild(key, mode) {
    const st = bs(key);
    const kind = st.kind || 'parser';
    // Only a parser is built FROM a document; a scraper revise works from the
    // harness's own failure logs, so it needs no sample.
    if (kind === 'parser' && !st.sample) { toast('Choose a sample document first.', false); return; }
    clearToast();
    const args = { kind, source_key: key, mode: mode || 'build' };
    if (kind === 'parser') args.sample_path = st.sample.sample_path;
    if (mode === 'revise') args.feedback = st.feedback || '';
    // Reuse the demonstration just captured rather than asking for another one.
    const demo = demoState[key];
    if (kind === 'scraper' && demo && demo.demo_path) args.demo_path = demo.demo_path;
    try {
      await callTool('start_build', args);
      st.status = 'running'; st.events = []; st.result = null; st.passed = false; st.message = null;
      st.token = (st.token || 0) + 1;
      await renderIngest();
      pollBuild(key, st.token);
    } catch (e) {
      toast('Couldn’t start the build: ' + e.message, false);
    }
  }

  function pollBuild(key, token) {
    const tick = async () => {
      const st = bs(key);
      if (st.token !== token) return;            // a newer build superseded this one
      let s;
      try {
        s = await callTool('build_status', { source_key: key, event_offset: st.events.length });
      } catch (e) {
        st.status = 'failed'; st.message = 'Lost contact with the build: ' + e.message;
        await renderIngest();
        return;
      }
      if (st.token !== token) return;
      if (s.events && s.events.length) st.events = st.events.concat(s.events);

      if (s.status === 'running') {
        // Update only the stream so typing/scroll elsewhere isn't disturbed.
        const host = el('stream-' + sourceDomId(key));
        if (host) {
          const shown = st.events.slice(-40);
