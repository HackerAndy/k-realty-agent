[tool.poetry]
name = "k-realty"
version = "0.1.0"
description = "Browser automation agent that extracts transactions from 8 financial sources (property manager, bank, loans, insurance, services), categorizes them against a Schedule E-aligned tax category list, and delivers a monthly P&L report per property — replacing a manual process that currently goes undone."
authors = ["Hacker Andy <kaminski.andy@gmail.com>"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "evals" },
    { include = "orchestration" },
    { include = "interfaces" },
]

[tool.poetry.scripts]
agent-web = "interfaces.rest_server:main"
agent-mcp = "interfaces.mcp_server:main"

[tool.poetry.dependencies]
python = "^3.14"
pydantic = ">=2.7"
pyyaml = ">=6.0"
langgraph = ">=0.2"
playwright = "^1.61.0"
cryptography = "^49.0.0"
questionary = "^2.1.1"
pdfplumber = "^0.11.10"
anthropic = "^0.116.0"
ruamel-yaml = "^0.19.1"
google-api-python-client = "^2.198.0"
google-auth = "^2.56.0"
google-auth-oauthlib = "^1.4.0"
mcp = "^1.28.1"
fastapi = "^0.139.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"
reportlab = "^5.0.0"
coverage = "^7.15.2"

[tool.pytest.ini_options]
# The codegen bench copies the parser and test the agent wrote into
# orchestration/bench/results/ so a bad run can be read afterwards. Those are
# real pytest files importing modules that only ever existed inside a throwaway
# worktree, so collecting them breaks the whole suite on a collection error.
# Gitignored is not the same as invisible to pytest.
addopts = ["--ignore=orchestration/bench/results"]

# Stated explicitly so nothing can guess wrong. Without it, `pip install -e .`
# fell back to setuptools, which refuses a flat layout with four top-level
# packages — which is why every CI run failed at install.
[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
