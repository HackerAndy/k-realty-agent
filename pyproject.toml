[tool.poetry]
name = "k-realty"
version = "0.1.0"
description = "Browser automation agent that extracts transactions from 8 financial sources (property manager, bank, loans, insurance, services), categorizes them against a Schedule E-aligned tax category list, and delivers a monthly P&L report per property — replacing a manual process that currently goes undone."
authors = ["Hacker Andy <kaminski.andy@gmail.com>"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "evals" },
    { include = "orchestration" },
    { include = "interfaces" },
]

[tool.poetry.scripts]
agent = "interfaces.tui:main"
agent-mcp = "interfaces.mcp_server:main"
agent-web = "interfaces.rest_server:main"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = ">=2.7"
pyyaml = ">=6.0"
langgraph = ">=0.2"
playwright = "^1.61.0"
cryptography = "^49.0.0"
questionary = "^2.1.1"
pdfplumber = "^0.11.10"
anthropic = "^0.116.0"
ruamel-yaml = "^0.19.1"
google-api-python-client = "^2.198.0"
google-auth = "^2.56.0"
google-auth-oauthlib = "^1.4.0"
mcp = "^1.28.1"
fastapi = "^0.139.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"
reportlab = "^5.0.0"
coverage = "^7.15.2"

[tool.ruff]
line-length = 100
