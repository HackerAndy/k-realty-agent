<title>K-Realty · adding a data source</title>
<!-- THROWAWAY PROTOTYPE — 3 ways to add a source, ?variant=A|B|C. FAKE data. -->
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --card-2:#fbfaf7; --border:#e5e3da; --border-strong:#d5d2c6;
    --text:#1b1c19; --muted:#6d6f66; --faint:#9a9c92;
    --accent:#356534; --accent-soft:#e8f0e6; --accent-line:#bcd4b8;
    --warn:#9a6a12; --shadow:0 1px 2px rgba(30,32,26,.05),0 6px 20px rgba(30,32,26,.06);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#151713; --card:#1e211c; --card-2:#242822; --border:#333831; --border-strong:#414740;
    --text:#e9ece5; --muted:#a3a99d; --faint:#767c70;
    --accent:#8fca87; --accent-soft:#243026; --accent-line:#3c5138; --warn:#d7ab5c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#151713; --card:#1e211c; --card-2:#242822; --border:#333831; --border-strong:#414740;
    --text:#e9ece5; --muted:#a3a99d; --faint:#767c70;
    --accent:#8fca87; --accent-soft:#243026; --accent-line:#3c5138; --warn:#d7ab5c;
  }
  :root[data-theme="light"]{
    --bg:#f6f5f1; --card:#fff; --card-2:#fbfaf7; --border:#e5e3da; --border-strong:#d5d2c6;
    --text:#1b1c19; --muted:#6d6f66; --faint:#9a9c92;
    --accent:#356534; --accent-soft:#e8f0e6; --accent-line:#bcd4b8; --warn:#9a6a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:980px;margin:0 auto;padding:20px 22px 120px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
  @media (prefers-color-scheme:dark){.brand .mark{color:#12160f}}
  .brand b{font-size:15px;font-weight:650}
  .pillars{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .pillars button{font:inherit;font-size:13px;border:none;background:transparent;color:var(--muted);padding:7px 15px;border-radius:999px;display:inline-flex;gap:7px;align-items:center}
  .pillars button .step{font-size:10px;font-weight:700;color:var(--faint)}
  .pillars button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .pagehead{margin:18px 2px}
  .pagehead h1{font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
  .pagehead p{margin:3px 0 0;color:var(--muted);font-size:13.5px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
  .existing{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;opacity:.62}
  .srchead{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .srchead .ico{width:34px;height:34px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);display:grid;place-items:center;font-size:16px}
  .srchead .nm{font-weight:640;font-size:14.5px}
  .srchead .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .srchead .rt{margin-left:auto;color:var(--faint);font-size:12px;text-align:right}

  .add{border:1px dashed var(--border-strong);border-radius:12px;background:transparent}
  .add-h{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;font-size:14px}
  .add-h .plus{width:24px;height:24px;border-radius:7px;border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--muted);font-size:15px}
  .add-b{padding:0 16px 16px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
  .field{display:flex;flex-direction:column;gap:5px;max-width:460px;margin-bottom:12px}
  .field label{font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=url]{font:inherit;font-size:13px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
  .sub{font-size:11.5px;color:var(--faint)}
  .btn{font:inherit;font-size:13px;font-weight:550;padding:9px 14px;border-radius:9px;cursor:pointer;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:var(--accent-line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme:dark){.btn.primary{color:#12160f}}
  .btn[disabled]{opacity:.45;cursor:default}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  /* method tiles */
  .methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .method{border:1px solid var(--border);border-radius:11px;padding:13px;background:var(--card-2);cursor:pointer}
  .method:hover{border-color:var(--accent-line)}
  .method.on{border-color:var(--accent);background:var(--accent-soft)}
  .method .t{font-weight:640;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .method .d{color:var(--muted);font-size:12px;margin-top:5px}
  .method .needs{color:var(--faint);font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .method .needs b{color:var(--muted);font-weight:600}
  .method.wide{grid-column:1/-1}

  /* stepper */
  .steps{display:flex;gap:0;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .stepdot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint)}
  .stepdot .n{width:21px;height:21px;border-radius:999px;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-weight:700}
  .stepdot.on{color:var(--text);font-weight:600}
  .stepdot.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme:dark){.stepdot.on .n{color:#12160f}}
  .stepdot.done .n{border-color:var(--accent-line);color:var(--accent)}
  .steparrow{color:var(--faint);margin:0 12px}

  .list{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--card-2);cursor:pointer}
  .opt:hover{border-color:var(--accent-line)}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .opt .radio{width:15px;height:15px;border-radius:999px;border:1.5px solid var(--border-strong);flex:none}
  .opt.on .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
  .opt .t{font-weight:600;font-size:13px}
  .opt .d{color:var(--muted);font-size:12px}
  .opt .w{margin-left:auto;color:var(--faint);font-size:11.5px;text-align:right}

  .flag{background:color-mix(in oklab,var(--warn) 14%,transparent);border:1px solid color-mix(in oklab,var(--warn) 35%,var(--border));
    border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:12px}
  .flag b{color:var(--warn)}
  .note{margin:16px 2px 0;color:var(--faint);font-size:12.5px;max-width:74ch}

  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
    background:#16180f;color:#f4f3ee;padding:7px 8px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:99;font-size:13px}
  @media (prefers-color-scheme:dark){.bar{background:#eceadf;color:#16180f}}
  .bar .tag2{font-size:10px;opacity:.55;text-transform:uppercase;letter-spacing:.09em;padding:0 6px}
  .bar button{font:inherit;cursor:pointer;background:transparent;border:none;color:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;opacity:.62}
  .bar button:hover{opacity:1}
  .bar button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
  @media (prefers-color-scheme:dark){.bar button.on{background:rgba(0,0,0,.12)}}
</style>

<div class="app">
  <div class="top">
    <div class="brand"><span class="mark">K</span><b>K-Realty</b></div>
    <div class="pillars">
      <button class="on"><span class="step">1</span>Ingest</button>
      <button><span class="step">2</span>Process</button>
      <button><span class="step">3</span>Report</button>
    </div>
  </div>
  <div class="pagehead"><h1>Data sources</h1>
    <p>Acquire and validate each source before processing.</p></div>

  <!-- context: the sources you already have, dimmed -->
  <div class="existing">
    <div class="card"><div class="srchead"><div class="ico">&#127970;</div>
      <div><div class="nm">Epic Property Management</div><div class="sub">implemented · 3 ways in</div></div>
      <div class="rt">13 rows</div></div></div>
    <div class="card"><div class="srchead"><div class="ico">&#127974;</div>
      <div><div class="nm">DFCU Financial bank</div><div class="sub">implemented · 1 way in</div></div>
      <div class="rt">6 rows</div></div></div>
  </div>

  <div id="view"></div>
  <p class="note" id="note"></p>
</div>

<div class="bar">
  <span class="tag2">mockup</span>
  <button data-v="A" onclick="setV('A')">A · Steps</button>
  <button data-v="B" onclick="setV('B')">B · One form</button>
  <button data-v="C" onclick="setV('C')">C · Method first</button>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── FAKE: the ingestion methods the harness ALREADY knows how to do ──
const METHODS = [
  { id:'scrape', icon:'&#8635;', title:'A website behind a login',
    desc:'The harness signs in and pulls the data itself, on a schedule if you want.',
    needs:'You demonstrate it <b>once</b> — log in, set the filters, hit Generate. The agent watches and writes the scraper.',
    gives:'Runs unattended afterwards' },
  { id:'upload', icon:'&#8593;', title:'A file you already have',
    desc:'A PDF or CSV you download or receive — a statement, an export.',
    needs:'Give the agent <b>one real document</b>. It writes a parser and tests it against that sample.',
    gives:'You hand it the file each time' },
  { id:'email', icon:'&#9993;', title:'An attachment that arrives by email',
    desc:'The harness watches an inbox and pulls the document off the message.',
    needs:'Gmail consent (read-only) and which sender/subject to match.',
    gives:'Runs unattended afterwards',
    caveat:'An emailed document still has to be READ. You will also give it one sample so the agent can write the parser — email delivers, the parser understands.' },
];

const NOTES = {
  A:'A — one decision per step, nothing else on screen. Hardest to get lost in, but it is a little ceremonious for a thing you do maybe twice a year.',
  B:'B — everything on one card: name it, pick how it arrives, go. Fewest clicks, and it reads as part of the list rather than a separate mode.',
  C:'C — leads with what the harness can already DO, and what each way costs you. Best at answering "which of these should I pick?", which is the actual question when adding a source.',
};

// shared state so flipping variants keeps your choices
const S = { name:'', url:'', method:null, step:1 };

function methodCard(m, extra) {
  const on = S.method === m.id;
  return '<div class="method' + (on ? ' on' : '') + (extra || '') + '" onclick="pick(\'' + m.id + '\')">' +
    '<div class="t">' + m.icon + ' ' + esc(m.title) + '</div>' +
    '<div class="d">' + esc(m.desc) + '</div>' +
    '<div class="needs"><b>You provide:</b> ' + m.needs + '</div></div>';
}

function optRow(m) {
  const on = S.method === m.id;
  return '<div class="opt' + (on ? ' on' : '') + '" onclick="pick(\'' + m.id + '\')">' +
    '<span class="radio"></span><span>' + m.icon + '</span>' +
    '<span><div class="t">' + esc(m.title) + '</div><div class="d">' + esc(m.desc) + '</div></span>' +
    '<span class="w">' + esc(m.gives) + '</span></div>';
}

function caveat() {
  const m = METHODS.find(x => x.id === S.method);
  return (m && m.caveat) ? '<div class="flag"><b>Heads up.</b> ' + m.caveat + '</div>' : '';
}

function nameFields() {
  return '<div class="field"><label for="nm">What is this source?</label>' +
    '<input type="text" id="nm" value="' + esc(S.name) + '" oninput="S.name=this.value;paint()" ' +
    'placeholder="e.g. Shellpoint mortgage"><span class="sub">However you would say it out loud.</span></div>' +
    (S.method === 'scrape'
      ? '<div class="field"><label for="u">Where do you sign in?</label>' +
        '<input type="url" id="u" value="' + esc(S.url) + '" oninput="S.url=this.value;paint()" ' +
        'placeholder="https://…"></div>'
      : '');
}

function goRow(label) {
  const ready = S.name.trim() && S.method;
  return '<div class="row" style="margin-top:14px">' +
    '<button class="btn primary" ' + (ready ? '' : 'disabled') + '>' + esc(label) + '</button>' +
    (ready ? '' : '<span class="sub">Name it and choose how it arrives first.</span>') + '</div>';
}

// A — one decision per step
function renderA(){
  const steps = [['1','Name it'],['2','How it arrives'],['3','Build it with the agent']];
  const bar = '<div class="steps">' + steps.map(([n,t],i) => {
    const cls = S.step === i+1 ? ' on' : (S.step > i+1 ? ' done' : '');
    return '<span class="stepdot' + cls + '"><span class="n">' + n + '</span>' + t + '</span>' +
      (i < 2 ? '<span class="steparrow">&#8250;</span>' : '');
  }).join('') + '</div>';

  let body;
  if (S.step === 1) {
    body = nameFields() + '<div class="row"><button class="btn primary" ' +
      (S.name.trim() ? '' : 'disabled') + ' onclick="S.step=2;paint()">Next</button></div>';
  } else if (S.step === 2) {
    body = '<div class="list">' + METHODS.map(optRow).join('') + '</div>' + caveat() +
      '<div class="row" style="margin-top:14px">' +
      '<button class="btn" onclick="S.step=1;paint()">Back</button>' +
      '<button class="btn primary" ' + (S.method ? '' : 'disabled') + ' onclick="S.step=3;paint()">Next</button></div>';
  } else {
    body = '<p class="d" style="color:var(--muted);font-size:13px">The agent will now build the code for ' +
      '<b>' + esc(S.name || 'this source') + '</b>. ' +
      (S.method === 'scrape' ? 'A browser opens so you can demonstrate the navigation once.'
        : 'Choose one real document for it to learn from.') + '</p>' +
      '<div class="row"><button class="btn" onclick="S.step=2;paint()">Back</button>' +
      '<button class="btn primary">' + (S.method === 'scrape' ? 'Open the browser' : 'Choose a document') + '</button></div>';
  }

  document.getElementById('view').innerHTML =
    '<div class="add"><div class="add-h"><span class="plus">+</span>Add a data source</div>' +
    '<div class="add-b">' + bar + body + '</div></div>';
}

// B — one card, everything at once
function renderB(){
  document.getElementById('view').innerHTML =
    '<div class="add"><div class="add-h"><span class="plus">+</span>Add a data source</div>' +
    '<div class="add-b">' + nameFields() +
    '<div class="lbl">How will its data arrive?</div>' +
    '<div class="list">' + METHODS.map(optRow).join('') + '</div>' + caveat() +
    goRow('Build it with the agent') +
    '</div></div>';
}

// C — lead with what the harness can already do
function renderC(){
  document.getElementById('view').innerHTML =
    '<div class="add"><div class="add-h"><span class="plus">+</span>Add a data source</div>' +
    '<div class="add-b">' +
    '<p style="color:var(--muted);font-size:13px;margin:6px 0 0">Pick how its data will reach the harness. ' +
    'Each of these is already built — what differs is what it needs from you.</p>' +
    '<div class="lbl">Ways in the harness already knows</div>' +
    '<div class="methods">' + METHODS.map(m => methodCard(m)).join('') + '</div>' +
    caveat() +
    (S.method ? '<div class="lbl">And what is it?</div>' + nameFields() : '') +
    goRow('Build it with the agent') +
    '</div></div>';
}

function pick(id){ S.method = id; paint(); }
let V='C';
function paint(){ ({A:renderA,B:renderB,C:renderC}[V])(); }
function setV(v){
  V=v; S.step=1;
  document.querySelectorAll('.bar button[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  paint();
  document.getElementById('note').textContent = NOTES[v];
  const u=new URL(location); u.searchParams.set('variant',v); history.replaceState({},'',u);
}
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  const ks=['A','B','C']; let i=ks.indexOf(V);
  if(e.key==='ArrowLeft') setV(ks[(i+2)%3]);
  if(e.key==='ArrowRight') setV(ks[(i+1)%3]);
});
setV((new URLSearchParams(location.search).get('variant')||'C').toUpperCase().replace(/[^ABC]/,'')||'C');
</script>
